# Reusable "prepare" half of the desktop release: build the Tauri desktop
# packages (Windows + macOS), run the install/launch/chat UI verification,
# and upload the installers + updater sidecars as run artifacts.
#
# This workflow performs NO publishing. It is called by release.yml during the
# prepare phase (pinned to the release commit via `ref`), and can also be run
# standalone via workflow_dispatch to validate a packaging change.
#
# The matching publish half lives in desktop-publish.yml.

name: Desktop Build (reusable)

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref/SHA to build (pins the build to the release commit)"
        type: string
        required: false
        default: ""
      require_updater_assets:
        description: "Require signed updater archives (production releases)"
        type: boolean
        required: false
        default: false
      platform:
        description: "Desktop platform to build"
        type: string
        required: false
        default: "all"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref/SHA to build (default: this workflow's ref)"
        type: string
        required: false
        default: ""
      require_updater_assets:
        description: "Require signed updater archives"
        type: boolean
        required: false
        default: false
      platform:
        description: "Desktop platform to build (all, windows, macos)"
        type: choice
        options: [all, windows, macos]
        required: false
        default: all

permissions:
  contents: read

jobs:
  check-updater-signing:
    runs-on: ubuntu-latest
    steps:
      - name: Require production updater signing configuration
        if: ${{ inputs.require_updater_assets }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          set -euo pipefail
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          test -n "$TAURI_UPDATER_PUBKEY"
          test -n "${{ vars.QWENPAW_NODE_SHA256_WINDOWS || vars.QWENPAW_NODE_SHA256 }}"
          test -n "${{ vars.QWENPAW_NODE_SHA256_MACOS || vars.QWENPAW_NODE_SHA256 }}"
          test -n "${{ vars.QWENPAW_JRE_SHA256_WINDOWS || vars.QWENPAW_JRE_SHA256 }}"
          test -n "${{ vars.QWENPAW_JRE_SHA256_MACOS || vars.QWENPAW_JRE_SHA256 }}"
          test -n "${{ vars.QWENPAW_JAVA_RELEASE }}"

      - name: Report unsigned validation mode
        if: ${{ !inputs.require_updater_assets }}
        run: echo "Signed updater assets are not required for this standalone validation run"

  build-tauri-windows:
    needs: [check-updater-signing]
    if: ${{ inputs.platform == 'all' || inputs.platform == 'windows' }}
    env:
      QWENPAW_LAYERED_DESKTOP: "true"
      QWENPAW_REQUIRE_RUNTIME_HASHES: ${{ inputs.require_updater_assets && 'true' || 'false' }}
      QWENPAW_NODE_SHA256: ${{ vars.QWENPAW_NODE_SHA256_WINDOWS || vars.QWENPAW_NODE_SHA256 }}
      QWENPAW_JRE_SHA256: ${{ vars.QWENPAW_JRE_SHA256_WINDOWS || vars.QWENPAW_JRE_SHA256 }}
      QWENPAW_JAVA_RELEASE: ${{ vars.QWENPAW_JAVA_RELEASE }}
      QWENPAW_PYTHON_BUILD_STANDALONE_RELEASE: "20260623"
      QWENPAW_PYTHON_RUNTIME_SHA256: "7e0a8abfee952efc63dff290022a73f0185b586f522678ae7a757a56f23c289b"
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
          fetch-depth: 0
          submodules: recursive

      - name: Get version
        id: version
        uses: ./.github/actions/get-version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packaging helper dependencies
        run: python -m pip install packaging

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: requirements-desktop.lock

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: console/pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: console/src-tauri

      - name: Install NSIS
        uses: negrutiu/nsis-install@v2

      - name: Clean dist directory
        shell: pwsh
        run: |
          if (Test-Path dist) {
            Remove-Item -Recurse -Force dist
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null

      - name: Build Tauri Windows package
        shell: pwsh
        env:
          # Authenticate the python-build-standalone release lookup in
          # stage_python_runtime.py to avoid anonymous API rate limits.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          TAURI_UPDATER_ENDPOINTS: ${{ vars.TAURI_UPDATER_ENDPOINTS || 'https://ugsci-download.oss-cn-beijing.aliyuncs.com/metadata/qwenpaw-tauri-latest.json' }}
        run: ./scripts/pack-tauri/build_win_pyinstaller.ps1

      - name: Stage Tauri Windows installer and updater assets
        shell: pwsh
        run: |
          $bundle = "console/src-tauri/target/release/bundle"
          $portable = Get-Item "$bundle/UGSci-Desktop-portable.zip" -ErrorAction Stop
          $bridge = Get-Item "$bundle/UGSci-Desktop-migration.exe" -ErrorAction Stop
          $bridgeSig = "$($bridge.FullName).sig"
          if ('${{ inputs.require_updater_assets }}' -eq 'true' -and -not (Test-Path -LiteralPath $bridgeSig -PathType Leaf)) {
            throw 'Production b5-to-b7 migration bridge is missing its updater signature'
          }
          $inspectRoot = Join-Path $env:RUNNER_TEMP 'qwenpaw-portable-layout'
          if (Test-Path -LiteralPath $inspectRoot) { Remove-Item -LiteralPath $inspectRoot -Recurse -Force }
          Expand-Archive -LiteralPath $portable.FullName -DestinationPath $inspectRoot -Force
          foreach ($required in @('Setup.exe', 'install.ps1', 'version.json', 'checksums.sha256',
              'payload\UGSci.exe', 'payload\binaries\state\active.json',
              'payload\binaries\cli\qwenpaw.exe', 'payload\binaries\update-assistant\UGSciUpdateAssistant.exe')) {
            if (-not (Test-Path -LiteralPath (Join-Path $inspectRoot $required) -PathType Leaf)) {
              throw "Portable Windows installer is missing required entry: $required"
            }
          }
          python scripts/pack-tauri/verify_frozen_plugins.py --archive $portable.FullName
          $manifest = Get-Content -LiteralPath (Join-Path $inspectRoot 'version.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($manifest.schema -ne 1 -or $manifest.version -ne '${{ steps.version.outputs.version }}' -or
              $manifest.platform -ne 'windows-x86_64' -or $manifest.payload -ne 'payload') {
            throw 'Portable Windows version.json does not match the build target'
          }
          Copy-Item -LiteralPath $portable.FullName -Destination "dist/UGSci-Tauri-${{ steps.version.outputs.version }}-Windows-portable.zip" -Force
          python scripts/pack-tauri/generate_update_manifest.py stage `
            --bundle-dir $bundle `
            --pattern 'UGSci-Desktop-migration.exe' `
            --target windows-x86_64 `
            --output "dist/UGSci-Tauri-${{ steps.version.outputs.version }}-Windows-updater.exe" `
            --pubkey-config console/src-tauri/tauri.version.conf.json
          if ('${{ inputs.require_updater_assets }}' -eq 'true' -and -not (Test-Path 'dist/tauri-windows-x86_64-updater.json')) {
            throw 'Production Windows migration bridge updater metadata is missing'
          }
          Write-Host 'Staged ZIP + Setup.exe for first install and visible migration bridge for b5 update'

      - name: Verify desktop (Tauri Windows)
        timeout-minutes: 25
        uses: ./.github/actions/verify-tauri-windows
        with:
          dashscope-api-key: ${{ secrets.QWENPAW_DASHSCOPE_API_KEY }}

      - name: Stop desktop server (Tauri Windows)
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          # Kill the Tauri shell and its sidecar subprocess by name.
          Get-Process -Name "qwenpaw-desktop" -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process -Name "qwenpaw-backend" -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          Get-Process -Name "qwenpaw-desktop" -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process -Name "qwenpaw-backend" -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          exit 0

      - name: Stage desktop verify logs (Tauri Windows)
        if: failure()
        shell: pwsh
        run: |
          # upload-artifact requires all inputs to share one root directory.
          # Runner temp and LOCALAPPDATA are on different trees (and may even
          # be on different drives), so stage every diagnostic file first.
          $verifyLogRoot = Join-Path $env:RUNNER_TEMP 'desktop-verify-logs'
          if (Test-Path -LiteralPath $verifyLogRoot) {
            Remove-Item -LiteralPath $verifyLogRoot -Recurse -Force -ErrorAction SilentlyContinue
          }
          New-Item -ItemType Directory -Force -Path $verifyLogRoot | Out-Null

          $files = @(
            (Join-Path $env:RUNNER_TEMP 'qwenpaw-desktop-stdout.log'),
            (Join-Path $env:RUNNER_TEMP 'qwenpaw-desktop-stderr.log'),
            (Join-Path $env:RUNNER_TEMP 'qwenpaw-native-ui-report.json')
          )
          foreach ($file in $files) {
            if (Test-Path -LiteralPath $file -PathType Leaf) {
              Copy-Item -LiteralPath $file -Destination $verifyLogRoot -Force -ErrorAction SilentlyContinue
            }
          }

          $logDirs = @(
            (Join-Path $env:LOCALAPPDATA 'io.agentscope.qwenpaw.desktop\logs'),
            (Join-Path $env:LOCALAPPDATA 'com.qwenpaw.desktop\logs')
          )
          foreach ($dir in $logDirs) {
            if (Test-Path -LiteralPath $dir -PathType Container) {
              $name = Split-Path -Leaf (Split-Path -Parent $dir)
              $destination = Join-Path $verifyLogRoot $name
              New-Item -ItemType Directory -Force -Path $destination | Out-Null
              Copy-Item -Path (Join-Path $dir '*') -Destination $destination -Recurse -Force -ErrorAction SilentlyContinue
            }
          }

          if (-not (Get-ChildItem -LiteralPath $verifyLogRoot -Force -Recurse -ErrorAction SilentlyContinue)) {
            Set-Content -LiteralPath (Join-Path $verifyLogRoot 'NO_LOGS_FOUND.txt') -Value 'No desktop verification logs were produced.' -Encoding UTF8
          }

      - name: Upload desktop verify logs (Tauri Windows)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-verify-logs-tauri-windows-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/desktop-verify-logs
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload verify screenshots (Tauri Windows)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-verify-screenshots-tauri-windows-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/verify-screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Tauri Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: UGSci-Desktop-Tauri-Windows-${{ steps.version.outputs.version }}
          path: |
            dist/UGSci-Tauri-*-Windows-portable.zip
            dist/UGSci-Tauri-*-Windows-updater.exe
          compression-level: 0
          retention-days: 14

      - name: Archive Windows versioned component source
        run: |
          python scripts/pack-tauri/desktop_component_archive.py pack `
            --source console/src-tauri/binaries `
            --output dist/desktop-components-windows-x86_64.tar

      - name: Upload Windows versioned component source
        uses: actions/upload-artifact@v4
        with:
          name: desktop-components-windows-x86_64
          path: dist/desktop-components-windows-x86_64.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload Tauri Windows updater metadata
        if: hashFiles('dist/tauri-windows-x86_64-updater.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: tauri-updater-meta-windows
          path: |
            dist/UGSci-Tauri-*-Windows-updater.exe.sig
            dist/tauri-windows-x86_64-updater.json
          compression-level: 0
          retention-days: 14

  build-tauri-macos:
    needs: [check-updater-signing]
    if: ${{ inputs.platform == 'all' || inputs.platform == 'macos' }}
    env:
      QWENPAW_LAYERED_DESKTOP: "true"
      QWENPAW_REQUIRE_RUNTIME_HASHES: ${{ inputs.require_updater_assets && 'true' || 'false' }}
      QWENPAW_NODE_SHA256: ${{ vars.QWENPAW_NODE_SHA256_MACOS || vars.QWENPAW_NODE_SHA256 }}
      QWENPAW_JRE_SHA256: ${{ vars.QWENPAW_JRE_SHA256_MACOS || vars.QWENPAW_JRE_SHA256 }}
      QWENPAW_JAVA_RELEASE: ${{ vars.QWENPAW_JAVA_RELEASE }}
      QWENPAW_PYTHON_BUILD_STANDALONE_RELEASE: "20260623"
      QWENPAW_PYTHON_RUNTIME_SHA256: "d2324bfd1a7b9fc44ccd884c3a2505bcab6691dbfd4f8270e10c50aaa4e19506"
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Get version
        id: version
        uses: ./.github/actions/get-version

      - name: Require Apple Silicon build runner
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64" || {
            echo "Production macOS builds must run on Apple Silicon; Intel builds are disabled" >&2
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        env:
          PIP_NO_CACHE_DIR: "1"
        with:
          python-version: "3.11"

      - name: Install packaging helper dependencies
        run: python -m pip install packaging

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: requirements-desktop.lock

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: console/pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: console/src-tauri

      - name: Clean dist directory
        run: rm -rf dist && mkdir -p dist

      - name: Build Tauri macOS package
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
          # Authenticate the python-build-standalone release lookup in
          # stage_python_runtime.py to avoid anonymous API rate limits.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          TAURI_UPDATER_ENDPOINTS: ${{ vars.TAURI_UPDATER_ENDPOINTS || 'https://ugsci-download.oss-cn-beijing.aliyuncs.com/metadata/qwenpaw-tauri-latest.json' }}
        run: |
          chmod +x scripts/pack-tauri/build_macos_pyinstaller.sh
          bash scripts/pack-tauri/build_macos_pyinstaller.sh

      - name: Require signed macOS updater assets for production
        if: ${{ inputs.require_updater_assets }}
        run: |
          set -euo pipefail
          test -s dist/UGSci-Tauri-*-macOS.app.tar.gz
          test -s dist/UGSci-Tauri-*-macOS.app.tar.gz.sig
          test -s dist/tauri-darwin-*-updater.json

      - name: Verify desktop (Tauri macOS)
        timeout-minutes: 25
        uses: ./.github/actions/verify-tauri-macos
        with:
          dashscope-api-key: ${{ secrets.QWENPAW_DASHSCOPE_API_KEY }}

      - name: Stop desktop server (Tauri macOS)
        if: always()
        run: |
          # Kill the Tauri shell and its sidecar subprocess.
          pkill -f "UGSci Desktop" 2>/dev/null || true
          pkill -f "qwenpaw-backend" 2>/dev/null || true
          sleep 2
          pkill -9 -f "UGSci Desktop" 2>/dev/null || true
          pkill -9 -f "qwenpaw-backend" 2>/dev/null || true
          # Best-effort: kill anything sitting on the detected port.
          if [ -n "${BASE_URL:-}" ]; then
            PORT="${BASE_URL##*:}"
            lsof -ti:"$PORT" | xargs kill 2>/dev/null || true
          fi
          if [ -n "${TAURI_VERIFY_ROOT:-}" ] && [[ "$TAURI_VERIFY_ROOT" == "${RUNNER_TEMP:-/tmp}"/qwenpaw-verify-tauri.* ]]; then
            rm -rf -- "$TAURI_VERIFY_ROOT"
          fi

      - name: Upload desktop verify logs (Tauri macOS)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-verify-logs-tauri-macos-${{ steps.version.outputs.version }}
          path: |
            ${{ runner.temp }}/qwenpaw-desktop-stdout.log
            ${{ runner.temp }}/qwenpaw-desktop-stderr.log
            ${{ runner.temp }}/qwenpaw-native-ui-report.json
            ~/Library/Logs/io.agentscope.qwenpaw.desktop/
            ~/Library/Logs/com.qwenpaw.desktop/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload verify screenshots (Tauri macOS)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-verify-screenshots-tauri-macos-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/verify-screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Tauri macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: UGSci-Desktop-Tauri-macOS-${{ steps.version.outputs.version }}
          path: dist/UGSci-Tauri-*-macOS.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Archive macOS versioned component source
        run: |
          python scripts/pack-tauri/desktop_component_archive.py pack \
            --source console/src-tauri/binaries \
            --output dist/desktop-components-macos-aarch64.tar

      - name: Upload macOS versioned component source
        uses: actions/upload-artifact@v4
        with:
          name: desktop-components-macos-aarch64
          path: dist/desktop-components-macos-aarch64.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload Tauri macOS updater metadata
        uses: actions/upload-artifact@v4
        with:
          name: tauri-updater-meta-macos
          path: |
            dist/UGSci-Tauri-*-macOS.app.tar.gz
            dist/UGSci-Tauri-*-macOS.app.tar.gz.sig
            dist/tauri-darwin-*-updater.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
