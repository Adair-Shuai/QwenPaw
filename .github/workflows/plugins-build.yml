name: Plugins Build (reusable)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build"
        required: false
        type: string
        default: release

permissions:
  contents: read
  actions: write

jobs:
  build-plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Build OpenUI task layout runtime
        run: |
          npm --prefix plugins/bundle/qwenpaw-openui/frontend ci
          npm --prefix plugins/bundle/qwenpaw-openui/frontend test

      - name: Build memory plugin frontends
        shell: bash
        run: |
          shopt -s nullglob
          for frontend_dir in plugins/memory/*/frontend; do
            echo "Building ${frontend_dir}"
            npm --prefix "$frontend_dir" ci
            npm --prefix "$frontend_dir" run build
          done

      - name: Build Run Center frontend
        run: |
          npm --prefix plugins/bundle/qwenpaw-run-center/ui ci
          npm --prefix plugins/bundle/qwenpaw-run-center/ui run build

      # These applications publish through their own versioned pipelines.
      - name: Pack plugins and build index
        run: |
          python scripts/pack/generate_plugin_metadata.py \
            --plugins-root plugins \
            --dist dist/plugins \
            --metadata-out dist/plugins/index.json \
            --cdn-prefix /files/plugins \
            --exclude qwenpaw-creator \
            --exclude uproject \
            --exclude datapaw \
            --exclude qwenpaw-data
      - uses: actions/upload-artifact@v4
        with:
          name: qwenpaw-plugins-dist
          path: dist/plugins
          retention-days: 14
