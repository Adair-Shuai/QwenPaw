# Reusable "publish" half of the desktop release: take the desktop artifacts
# produced by desktop-build.yml (same run) and publish them.
#
# Called by release.yml during the gated publish phase. Performs two things:
#   - upload-release: attach the installers to the (draft) GitHub Release by tag
#     (this is safe to run on a fork, where it targets the fork's own release).
#   - upload-oss: push the VERSIONED files + metadata to the download OSS
#     bucket. The `latest` files, updater manifest and index are promoted
#     separately AFTER the release is published — see desktop-promote.yml.
#     Skipped when dry_run=true so fork verification never touches the shared
#     production bucket.

name: Desktop Publish (reusable)

on:
  workflow_call:
    inputs:
      tag:
        description: "Target (draft) release tag to attach assets to"
        type: string
        required: true
      release_id:
        description: "GitHub Release ID (required for hidden draft releases)"
        type: string
        required: false
        default: ""
      ref:
        description: "Git ref/SHA to checkout for the packaging scripts"
        type: string
        required: false
        default: ""
      dry_run:
        description: "Skip the production OSS upload (fork verification)"
        type: boolean
        required: false
        default: false
      artifacts_run_id:
        description: "Source workflow run for previously verified artifacts"
        type: string
        required: false
        default: ""
      windows_artifacts_run_id:
        description: "Optional newer run containing replacement Windows artifacts"
        type: string
        required: false
        default: ""
      macos_artifacts_run_id:
        description: "Optional newer run containing replacement macOS artifacts"
        type: string
        required: false
        default: ""

permissions:
  actions: read
  contents: read

jobs:
  # ── Attach installers to the (draft) GitHub Release ────────────────────────
  upload-release:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout (for artifact verification)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Download desktop installer artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: UGSci-Desktop-Tauri-*
          run-id: ${{ inputs.artifacts_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download desktop updater artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: tauri-updater-meta-*
          run-id: ${{ inputs.artifacts_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Overlay newer Windows artifacts
        if: ${{ inputs.windows_artifacts_run_id != '' }}
        run: rm -rf UGSci-Desktop-Tauri-Windows-* tauri-updater-meta-windows

      - name: Download replacement Windows artifacts
        if: ${{ inputs.windows_artifacts_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          pattern: UGSci-Desktop-Tauri-Windows-*
          run-id: ${{ inputs.windows_artifacts_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download replacement Windows updater metadata
        if: ${{ inputs.windows_artifacts_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: tauri-updater-meta-windows
          path: tauri-updater-meta-windows
          run-id: ${{ inputs.windows_artifacts_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Overlay newer macOS artifacts
        if: ${{ inputs.macos_artifacts_run_id != '' }}
        run: rm -rf UGSci-Desktop-Tauri-macOS-* tauri-updater-meta-macos

      - name: Download replacement macOS artifacts
        if: ${{ inputs.macos_artifacts_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          pattern: UGSci-Desktop-Tauri-macOS-*
          run-id: ${{ inputs.macos_artifacts_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download replacement macOS updater metadata
        if: ${{ inputs.macos_artifacts_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: tauri-updater-meta-macos
          path: tauri-updater-meta-macos
          run-id: ${{ inputs.macos_artifacts_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Re-verify final macOS archives before GitHub release upload
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mac_zips=(UGSci-Desktop-Tauri-macOS-*/UGSci-Tauri-*-macOS.zip)
          mac_updaters=(tauri-updater-meta-macos/UGSci-Tauri-*-macOS.app.tar.gz)
          if [ "${#mac_zips[@]}" -ne 1 ] || [ "${#mac_updaters[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one macOS ZIP and updater archive; found ${#mac_zips[@]} ZIP(s), ${#mac_updaters[@]} updater archive(s)"
            exit 1
          fi
          python scripts/pack-tauri/verify_frozen_plugins.py --archive "${mac_zips[0]}"
          python scripts/pack-tauri/verify_frozen_plugins.py --archive "${mac_updaters[0]}"

      - name: Attach desktop installers to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          mv UGSci-Desktop-Tauri-Windows-*/UGSci-Tauri-*-Windows-portable.zip . 2>/dev/null || true
          mv UGSci-Desktop-Tauri-Windows-*/UGSci-Tauri-*-Windows-updater.exe . 2>/dev/null || true
          mv UGSci-Desktop-Tauri-macOS-*/UGSci-Tauri-*-macOS.zip . 2>/dev/null || true
          mv tauri-updater-meta-macos/UGSci-Tauri-*-macOS.app.tar.gz . 2>/dev/null || true
          files=(UGSci-Tauri-*-Windows-portable.zip UGSci-Tauri-*-Windows-updater.exe UGSci-Tauri-*-macOS.zip UGSci-Tauri-*-macOS.app.tar.gz)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No desktop installers found to attach to the release"
            exit 1
          fi
          release_id="$RELEASE_ID"
          if [ -z "$release_id" ]; then
            release_id="$(gh release view "${{ inputs.tag }}" --repo "$GITHUB_REPOSITORY" --json databaseId --jq '.databaseId')"
          fi
          test -n "$release_id" || { echo "::error::Unable to resolve GitHub Release ID"; exit 1; }
          echo "Attaching immutable assets to draft release $release_id: ${files[*]}"
          release_assets="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100")"
          mkdir -p "$RUNNER_TEMP/release-assets"
          for file in "${files[@]}"; do
            name="$(basename "$file")"
            asset_id="$(jq -r --arg name "$name" '.[] | select(.name == $name) | .id' <<<"$release_assets" | head -1)"
            if [ -n "$asset_id" ]; then
              gh api -H 'Accept: application/octet-stream' \
                "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
                --output "$RUNNER_TEMP/release-assets/$name"
              cmp --silent "$file" "$RUNNER_TEMP/release-assets/$name" || {
                echo "::error::Refusing to replace immutable GitHub Release asset: $name"
                exit 1
              }
              echo "Verified existing release asset: $name"
            else
              gh api --method POST \
                -H 'Content-Type: application/octet-stream' \
                "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=$name" \
                --input "$file" >/dev/null
            fi
          done

  # ── Publish files + updater metadata to OSS (skipped on dry_run) ───────────
  upload-oss:
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    env:
      OSS_BUCKET: ${{ vars.OSS_BUCKET || 'ugsci-download' }}
      OSS_PUBLIC_BASE_URL: ${{ vars.OSS_PUBLIC_BASE_URL || 'https://ugsci-download.oss-cn-beijing.aliyuncs.com/files/apps/desktop' }}
    steps:
      - name: Checkout (for scripts)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packaging helper dependencies
        run: python -m pip install packaging

      - name: Get version
        id: version
        uses: ./.github/actions/get-version

      - name: Download desktop installer artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: UGSci-Desktop-Tauri-*
          run-id: ${{ inputs.artifacts_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download desktop updater artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: tauri-updater-meta-*
          run-id: ${{ inputs.artifacts_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Overlay newer Windows artifacts
        if: ${{ inputs.windows_artifacts_run_id != '' }}
        run: rm -rf UGSci-Desktop-Tauri-Windows-* tauri-updater-meta-windows

      - name: Download replacement Windows artifacts
        if: ${{ inputs.windows_artifacts_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          pattern: UGSci-Desktop-Tauri-Windows-*
          run-id: ${{ inputs.windows_artifacts_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download replacement Windows updater metadata
        if: ${{ inputs.windows_artifacts_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: tauri-updater-meta-windows
          path: tauri-updater-meta-windows
          run-id: ${{ inputs.windows_artifacts_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Overlay newer macOS artifacts
        if: ${{ inputs.macos_artifacts_run_id != '' }}
        run: rm -rf UGSci-Desktop-Tauri-macOS-* tauri-updater-meta-macos

      - name: Download replacement macOS artifacts
        if: ${{ inputs.macos_artifacts_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          pattern: UGSci-Desktop-Tauri-macOS-*
          run-id: ${{ inputs.macos_artifacts_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download replacement macOS updater metadata
        if: ${{ inputs.macos_artifacts_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: tauri-updater-meta-macos
          path: tauri-updater-meta-macos
          run-id: ${{ inputs.macos_artifacts_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Re-verify final macOS archives before OSS upload
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mac_zips=(UGSci-Desktop-Tauri-macOS-*/UGSci-Tauri-*-macOS.zip)
          mac_updaters=(tauri-updater-meta-macos/UGSci-Tauri-*-macOS.app.tar.gz)
          if [ "${#mac_zips[@]}" -ne 1 ] || [ "${#mac_updaters[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one macOS ZIP and updater archive; found ${#mac_zips[@]} ZIP(s), ${#mac_updaters[@]} updater archive(s)"
            exit 1
          fi
          python scripts/pack-tauri/verify_frozen_plugins.py --archive "${mac_zips[0]}"
          python scripts/pack-tauri/verify_frozen_plugins.py --archive "${mac_updaters[0]}"

      - name: Install ossutil
        run: |
          wget https://gosspublic.alicdn.com/ossutil/1.7.18/ossutil-v1.7.18-linux-amd64.zip
          unzip ossutil-v1.7.18-linux-amd64.zip
          chmod +x ossutil-v1.7.18-linux-amd64/ossutil64
          sudo mv ossutil-v1.7.18-linux-amd64/ossutil64 /usr/local/bin/ossutil
          ossutil --version

      - name: Configure ossutil
        run: |
          ossutil config -e ${{ secrets.OSS_ENDPOINT }} \
            -i ${{ secrets.OSS_ACCESS_KEY_ID }} \
            -k ${{ secrets.OSS_ACCESS_KEY_SECRET }} \
            -L CH

      - name: Require complete signed updater assets
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          windows_portable=$(find UGSci-Desktop-Tauri-Windows-* -name 'UGSci-Tauri-*-Windows-portable.zip' -type f -print -quit 2>/dev/null || true)
          windows_updater=$(find UGSci-Desktop-Tauri-Windows-* -name 'UGSci-Tauri-*-Windows-updater.exe' -type f -print -quit 2>/dev/null || true)
          if [ -z "$windows_portable" ] || [ -z "$windows_updater" ]; then
            echo "::error::No Windows installation artifact was downloaded"
            exit 1
          fi
          test -s tauri-updater-meta-windows/UGSci-Tauri-*-Windows-updater.exe.sig
          test -s tauri-updater-meta-windows/tauri-windows-x86_64-updater.json
          test -s tauri-updater-meta-macos/UGSci-Tauri-*-macOS.app.tar.gz
          test -s tauri-updater-meta-macos/UGSci-Tauri-*-macOS.app.tar.gz.sig
          test -s tauri-updater-meta-macos/tauri-darwin-*-updater.json

      - name: Process and upload Tauri artifacts (versioned only)
        # Only versioned files are uploaded here. The `latest` files, updater
        # manifest and index are promoted only after all publishers succeed —
        # see release.yml and desktop-promote.yml — so the auto-updater is
        # never pointed at a version whose build gates might still fail.
        if: hashFiles('UGSci-Desktop-Tauri-*/*') != ''
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          RELEASE_UPDATED_AT="$(git show -s --format=%cI HEAD)"

          upload_versioned() {
            local dirs="$1"
            local pattern="$2"
            local platform="$3"
            local versioned_name="$4"
            local metadata="$5"

            local artifact
            artifact=$(find ${dirs} -name "${pattern}" 2>/dev/null | head -1 || true)
            if [ -z "${artifact}" ]; then
              echo "No ${platform} Tauri artifact found, skipping"
              return 0
            fi

            echo "Processing ${platform} Tauri artifact: ${artifact}"
            python scripts/pack/generate_oss_metadata.py \
              --file "${artifact}" \
              --product desktop \
              --platform "${platform}" \
              --version "${VERSION}" \
              --updated-at "${RELEASE_UPDATED_AT}" \
              --output "${metadata}"

            python -c 'import json,sys; from pathlib import Path; doc=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8")); expected=sys.argv[2]; assert doc.get("filename") == expected and str(doc.get("url", "")).endswith("/" + expected), f"metadata does not point at immutable object {expected!r}"' "${metadata}" "${versioned_name}"

            versioned_uri="oss://${OSS_BUCKET}/files/apps/desktop/${platform}/${versioned_name}"
            metadata_uri="oss://${OSS_BUCKET}/metadata/apps/desktop/${platform}/${versioned_name}.json"
            publish_immutable() {
              local file="$1" uri="$2" label="$3"
              local remote_dir
              remote_dir="$(mktemp -d)"
              local remote="${remote_dir}/$(basename "$file")"
              if ossutil cp "$uri" "$remote" >/dev/null 2>&1; then
                cmp --silent "$file" "$remote" || { echo "Immutable ${label} differs: $uri" >&2; exit 1; }
                rm -rf "$remote_dir"
                echo "Verified existing immutable ${label}"
                return
              fi
              ossutil cp "$file" "$uri" --acl public-read \
                --meta "Cache-Control:public, max-age=31536000, immutable"
              ossutil cp "$uri" "$remote"
              cmp --silent "$file" "$remote" || { echo "Remote ${label} verification failed: $uri" >&2; exit 1; }
              rm -rf "$remote_dir"
            }
            publish_metadata_immutable() {
              local file="$1" uri="$2" label="$3"
              local remote_dir
              remote_dir="$(mktemp -d)"
              local remote="${remote_dir}/$(basename "$file")"
              if ossutil cp "$uri" "$remote" >/dev/null 2>&1; then
                if python -c 'import json,sys; from pathlib import Path; a=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8")); b=json.loads(Path(sys.argv[2]).read_text(encoding="utf-8")); a.pop("updated_at",None); b.pop("updated_at",None); raise SystemExit(0 if a == b else 1)' "$file" "$remote"; then
                  :
                else
                  echo "Immutable ${label} differs: ${uri}" >&2
                  rm -rf "$remote_dir"
                  exit 1
                fi
                rm -rf "$remote_dir"
                echo "Verified existing immutable ${label} (timestamp-only difference allowed)"
                return
              fi
              ossutil cp "$file" "$uri" --acl public-read \
                --meta "Cache-Control:public, max-age=31536000, immutable"
              ossutil cp "$uri" "$remote"
              if python -c 'import json,sys; from pathlib import Path; a=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8")); b=json.loads(Path(sys.argv[2]).read_text(encoding="utf-8")); a.pop("updated_at",None); b.pop("updated_at",None); raise SystemExit(0 if a == b else 1)' "$file" "$remote"; then
                :
              else
                echo "Remote ${label} verification failed: ${uri}" >&2
                rm -rf "$remote_dir"
                exit 1
              fi
              rm -rf "$remote_dir"
            }
            publish_immutable "${artifact}" "$versioned_uri" "desktop artifact"
            publish_metadata_immutable "${metadata}" "$metadata_uri" "desktop metadata"
          }

          upload_versioned \
            "UGSci-Desktop-Tauri-Windows-*" \
            "UGSci-Tauri-*-Windows-portable.zip" \
            "win-tauri" \
            "UGSci-Tauri-${VERSION}-Windows-portable.zip" \
            "win-tauri-portable-metadata.json"

          upload_versioned \
            "UGSci-Desktop-Tauri-Windows-*" \
            "UGSci-Tauri-*-Windows-updater.exe" \
            "win-tauri" \
            "UGSci-Tauri-${VERSION}-Windows-updater.exe" \
            "win-tauri-updater-metadata.json"

          upload_versioned \
            "UGSci-Desktop-Tauri-macOS-*" \
            "UGSci-Tauri-*-macOS.zip" \
            "mac-tauri" \
            "UGSci-Tauri-${VERSION}-macOS.zip" \
            "mac-tauri-metadata.json"

      - name: Upload Tauri macOS updater archive to OSS
        # The .zip is for first-install; the auto-updater pulls .app.tar.gz.
        if: hashFiles('tauri-updater-meta-macos/*.app.tar.gz') != ''
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          RELEASE_UPDATED_AT="$(git show -s --format=%cI HEAD)"
          APP_TAR_GZ=$(find tauri-updater-meta-macos -name "UGSci-Tauri-*-macOS.app.tar.gz" | head -1)
          if [ -z "$APP_TAR_GZ" ]; then
            echo "No macOS .app.tar.gz found, skipping"
            exit 0
          fi
          python scripts/pack/generate_oss_metadata.py \
            --file "$APP_TAR_GZ" \
            --product desktop \
            --platform mac-tauri \
            --version "$VERSION" \
            --updated-at "$RELEASE_UPDATED_AT" \
            --output mac-tauri-updater-metadata.json

          updater_uri="oss://${OSS_BUCKET}/files/apps/desktop/mac-tauri/UGSci-Tauri-${VERSION}-macOS.app.tar.gz"
          metadata_uri="oss://${OSS_BUCKET}/metadata/apps/desktop/mac-tauri/UGSci-Tauri-${VERSION}-macOS.app.tar.gz.json"
          remote="${RUNNER_TEMP}/macos-updater-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.app.tar.gz"
          if ossutil cp "$updater_uri" "$remote" >/dev/null 2>&1; then
            cmp --silent "$APP_TAR_GZ" "$remote" || {
              echo "Immutable macOS updater artifact differs: $updater_uri" >&2
              exit 1
            }
            rm -f "$remote"
            echo "Verified existing immutable macOS updater artifact"
          else
            ossutil cp "$APP_TAR_GZ" \
              "$updater_uri" \
              --acl public-read \
              --meta "Cache-Control:public, max-age=31536000, immutable"
            ossutil cp "$updater_uri" "$remote"
            cmp --silent "$APP_TAR_GZ" "$remote" || {
              echo "Remote macOS updater verification failed: $updater_uri" >&2
              exit 1
            }
            rm -f "$remote"
          fi

          metadata_tmp="${RUNNER_TEMP}/macos-updater-metadata-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          if ossutil cp "$metadata_uri" "$metadata_tmp" >/dev/null 2>&1; then
            python -c 'import json,sys; from pathlib import Path; a=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8")); b=json.loads(Path(sys.argv[2]).read_text(encoding="utf-8")); a.pop("updated_at",None); b.pop("updated_at",None); raise SystemExit(0 if a == b else 1)' mac-tauri-updater-metadata.json "$metadata_tmp"
            echo "Verified existing immutable macOS updater metadata"
            rm -f "$metadata_tmp"
          else
            ossutil cp mac-tauri-updater-metadata.json "$metadata_uri" --acl public-read \
              --meta "Cache-Control:public, max-age=31536000, immutable"
            ossutil cp "$metadata_uri" "$metadata_tmp"
            python -c 'import json,sys; from pathlib import Path; a=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8")); b=json.loads(Path(sys.argv[2]).read_text(encoding="utf-8")); a.pop("updated_at",None); b.pop("updated_at",None); raise SystemExit(0 if a == b else 1)' mac-tauri-updater-metadata.json "$metadata_tmp"
            rm -f "$metadata_tmp"
          fi

      # NOTE: the `latest` files, the updater manifest
      # (qwenpaw-tauri-latest.json) and the index are intentionally NOT uploaded
      # here. They are promoted only AFTER the release is flipped to published —
      # see desktop-promote.yml — so existing users' auto-updater is never
      # pointed at a version whose release might still fail to publish.
