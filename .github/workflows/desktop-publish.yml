# Reusable "publish" half of the desktop release: take the desktop artifacts
# produced by desktop-build.yml (same run) and publish them.
#
# Called by release.yml during the gated publish phase. Performs two things:
#   - upload-release: attach the installers to the (draft) GitHub Release by tag
#     (this is safe to run on a fork, where it targets the fork's own release).
#   - upload-oss: push the VERSIONED files + metadata to the download OSS
#     bucket. The `latest` files, updater manifest and index are promoted
#     separately AFTER the release is published — see desktop-promote.yml.
#     Skipped when dry_run=true so fork verification never touches the shared
#     production bucket.

name: Desktop Publish (reusable)

on:
  workflow_call:
    inputs:
      tag:
        description: "Target (draft) release tag to attach assets to"
        type: string
        required: true
      ref:
        description: "Git ref/SHA to checkout for the packaging scripts"
        type: string
        required: false
        default: ""
      dry_run:
        description: "Skip the production OSS upload (fork verification)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  # ── Attach installers to the (draft) GitHub Release ────────────────────────
  upload-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Attach desktop installers to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          mv UGSci-Desktop-Tauri-Windows-*/UGSci-Tauri-*-Windows-setup.exe . 2>/dev/null || true
          mv UGSci-Desktop-Tauri-macOS-*/UGSci-Tauri-*-macOS.zip . 2>/dev/null || true
          mv tauri-updater-meta-macos/UGSci-Tauri-*-macOS.app.tar.gz . 2>/dev/null || true
          files=(UGSci-Tauri-*-Windows-setup.exe UGSci-Tauri-*-macOS.zip UGSci-Tauri-*-macOS.app.tar.gz)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No desktop installers found to attach to the release"
            exit 1
          fi
          echo "Attaching to draft release ${{ inputs.tag }}: ${files[*]}"
          gh release upload "${{ inputs.tag }}" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"

  # ── Publish files + updater metadata to OSS (skipped on dry_run) ───────────
  upload-oss:
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    env:
      OSS_BUCKET: ${{ vars.OSS_BUCKET || 'ugsci-download' }}
      OSS_PUBLIC_BASE_URL: ${{ vars.OSS_PUBLIC_BASE_URL || 'https://ugsci-download.oss-cn-beijing.aliyuncs.com/files/apps/desktop' }}
    steps:
      - name: Checkout (for scripts)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packaging helper dependencies
        run: python -m pip install packaging

      - name: Get version
        id: version
        uses: ./.github/actions/get-version

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Install ossutil
        run: |
          wget https://gosspublic.alicdn.com/ossutil/1.7.18/ossutil-v1.7.18-linux-amd64.zip
          unzip ossutil-v1.7.18-linux-amd64.zip
          chmod +x ossutil-v1.7.18-linux-amd64/ossutil64
          sudo mv ossutil-v1.7.18-linux-amd64/ossutil64 /usr/local/bin/ossutil
          ossutil --version

      - name: Configure ossutil
        run: |
          ossutil config -e ${{ secrets.OSS_ENDPOINT }} \
            -i ${{ secrets.OSS_ACCESS_KEY_ID }} \
            -k ${{ secrets.OSS_ACCESS_KEY_SECRET }} \
            -L CH

      - name: Require complete signed updater assets
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          test -s tauri-updater-meta-macos/UGSci-Tauri-*-macOS.app.tar.gz
          test -s tauri-updater-meta-macos/UGSci-Tauri-*-macOS.app.tar.gz.sig
          test -s tauri-updater-meta-macos/tauri-darwin-*-updater.json

      - name: Process and upload Tauri artifacts (versioned only)
        # Only versioned files are uploaded here. The `latest` files, updater
        # manifest and index are promoted AFTER the release is published — see
        # desktop-promote.yml — so the auto-updater is never pointed at a version
        # whose release/PyPI/Docker publish might still fail.
        if: hashFiles('UGSci-Desktop-Tauri-*/*') != ''
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          upload_versioned() {
            local dirs="$1"
            local pattern="$2"
            local platform="$3"
            local versioned_name="$4"
            local metadata="$5"

            local artifact
            artifact=$(find ${dirs} -name "${pattern}" 2>/dev/null | head -1 || true)
            if [ -z "${artifact}" ]; then
              echo "No ${platform} Tauri artifact found, skipping"
              return 0
            fi

            echo "Processing ${platform} Tauri artifact: ${artifact}"
            python scripts/pack/generate_oss_metadata.py \
              --file "${artifact}" \
              --product desktop \
              --platform "${platform}" \
              --version "${VERSION}" \
              --output "${metadata}"

            python - "${metadata}" "${versioned_name}" <<'PY'
            import json
            import sys
            from pathlib import Path

            metadata_path, expected_name = sys.argv[1:]
            doc = json.loads(Path(metadata_path).read_text(encoding="utf-8"))
            if doc.get("filename") != expected_name or not str(doc.get("url", "")).endswith("/" + expected_name):
                raise SystemExit(
                    f"metadata points at {doc.get('filename')!r}, expected immutable object {expected_name!r}"
                )
            PY

            versioned_uri="oss://${OSS_BUCKET}/files/apps/desktop/${platform}/${versioned_name}"
            metadata_uri="oss://${OSS_BUCKET}/metadata/apps/desktop/${platform}/${versioned_name}.json"
            if ossutil ls "$versioned_uri" >/dev/null 2>&1 || ossutil ls "$metadata_uri" >/dev/null 2>&1; then
              echo "Refusing to overwrite immutable desktop release object for ${VERSION}/${platform}" >&2
              exit 1
            fi
            ossutil cp "${artifact}" \
              "$versioned_uri" \
              --acl public-read \
              --meta "Cache-Control:public, max-age=31536000, immutable" \
              --header "x-oss-forbid-overwrite:true"
            ossutil cp "${metadata}" \
              "$metadata_uri" \
              --acl public-read \
              --meta "Cache-Control:public, max-age=31536000, immutable" \
              --header "x-oss-forbid-overwrite:true"
            ossutil ls "$versioned_uri" >/dev/null
            ossutil ls "$metadata_uri" >/dev/null
          }

          upload_versioned \
            "UGSci-Desktop-Tauri-Windows-*" \
            "UGSci-Tauri-*-Windows-setup.exe" \
            "win-tauri" \
            "UGSci-Tauri-${VERSION}-Windows-setup.exe" \
            "win-tauri-metadata.json"

          upload_versioned \
            "UGSci-Desktop-Tauri-macOS-*" \
            "UGSci-Tauri-*-macOS.zip" \
            "mac-tauri" \
            "UGSci-Tauri-${VERSION}-macOS.zip" \
            "mac-tauri-metadata.json"

      - name: Upload Tauri macOS updater archive to OSS
        # The .zip is for first-install; the auto-updater pulls .app.tar.gz.
        if: hashFiles('tauri-updater-meta-macos/*.app.tar.gz') != ''
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          APP_TAR_GZ=$(find tauri-updater-meta-macos -name "UGSci-Tauri-*-macOS.app.tar.gz" | head -1)
          if [ -z "$APP_TAR_GZ" ]; then
            echo "No macOS .app.tar.gz found, skipping"
            exit 0
          fi
          updater_uri="oss://${OSS_BUCKET}/files/apps/desktop/mac-tauri/UGSci-Tauri-${VERSION}-macOS.app.tar.gz"
          if ossutil ls "$updater_uri" >/dev/null 2>&1; then
            echo "Refusing to overwrite immutable macOS updater artifact for ${VERSION}" >&2
            exit 1
          fi
          ossutil cp "$APP_TAR_GZ" \
            "$updater_uri" \
            --acl public-read \
            --meta "Cache-Control:public, max-age=31536000, immutable" \
            --header "x-oss-forbid-overwrite:true"
          ossutil ls "$updater_uri" >/dev/null

      # NOTE: the `latest` files, the updater manifest
      # (qwenpaw-tauri-latest.json) and the index are intentionally NOT uploaded
      # here. They are promoted only AFTER the release is flipped to published —
      # see desktop-promote.yml — so existing users' auto-updater is never
      # pointed at a version whose release might still fail to publish.
