name: FlowForge Plugin Release

on:
  push:
    branches: [codex/flowforge-release-0.1.11]
    paths:
      - "plugins/bundle/flowforge/**"
      - "scripts/pack/publish_flowforge.py"
      - ".github/workflows/flowforge-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oss-production-metadata
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      QWENPAW_WORKING_DIR: ${{ github.workspace }}/.release-test-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install host and publication dependencies
        run: python -m pip install -e ".[test]" oss2 segno
      - name: Build and type-check the FlowForge frontend
        working-directory: plugins/bundle/flowforge/ui
        run: |
          npm ci
          npx tsc --noEmit
          npm run build
      - name: Verify reproducible frontend and source mirrors
        run: |
          git diff --exit-code -- plugins/bundle/flowforge/ui/dist/index.js
          python scripts/sync_flowforge_bundle.py --check
          # Exercise installation with the clean release tree. npm's Linux
          # development executables include symlinks outside the plugin payload.
          rm -rf plugins/bundle/flowforge/ui/node_modules
      - name: Verify workflow execution and signed publication transactions
        run: python -m pytest tests/unit/plugins/flowforge tests/unit/tauri/test_storage_capacity_publication.py tests/unit/tauri/test_flowforge_publication.py -q
      - name: Verify actual mounted workflow pages
        run: |
          npm --prefix console ci --ignore-scripts
          npm --prefix src/qwenpaw/plugins_bundle/flowforge/ui ci
          cd console
          npx vitest run src/plugins/flowForge*.test.tsx --maxWorkers=2
          rm -rf ../src/qwenpaw/plugins_bundle/flowforge/ui/node_modules
      - name: Verify update compatibility and signed package contents
        run: python scripts/verify_update_regressions.py
      - name: Package FlowForge
        run: python scripts/pack/generate_plugin_metadata.py --plugins-root plugins --dist dist/flowforge --cdn-prefix /files/plugins --only flowforge
      - name: Publish catalog and signed Windows and macOS updates
        env:
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ vars.OSS_BUCKET || 'ugsci-download' }}
          COMPONENT_SIGNING_PRIVATE_KEY: ${{ secrets.COMPONENT_SIGNING_PRIVATE_KEY }}
        run: python scripts/pack/publish_flowforge.py
      - name: Preserve publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flowforge-release
          path: dist/flowforge/
          retention-days: 30
