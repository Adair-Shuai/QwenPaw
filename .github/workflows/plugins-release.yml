name: Release Plugins (independent)

on:
  workflow_dispatch:
    inputs:
      plugin_id:
        description: "One plugin ID to build and release (apps use their dedicated workflows)"
        required: true
        type: string
      upload_to_oss:
        description: "Upload to OSS"
        required: false
        type: boolean
        default: false

concurrency:
  group: oss-production-metadata
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  upload-oss:
    runs-on: ubuntu-latest
    env:
      # Keep the bucket configurable for forks/environments while defaulting
      # to the public QwenPaw download bucket used by the update pipeline.
      OSS_BUCKET: ${{ vars.OSS_BUCKET || 'ugsci-download' }}
      PLUGIN_ID: ${{ inputs.plugin_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Resolve selected plugin
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          selected = []
          for manifest in Path('plugins').glob('*/*/plugin.json'):
              data = json.loads(manifest.read_text(encoding='utf-8'))
              if data.get('id') == os.environ['PLUGIN_ID']:
                  if manifest.parts[1] == 'apps' or data.get('type') == 'app':
                      raise SystemExit('Applications use their independent release workflows')
                  selected.append(manifest.parent.as_posix())
          if len(selected) != 1:
              raise SystemExit('Select exactly one existing plugin ID')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f'PLUGIN_DIRECTORY={selected[0]}\n')
          PY

      - name: Build OpenUI plugin
        if: inputs.plugin_id == 'qwenpaw-openui'
        run: |
          npm --prefix plugins/bundle/qwenpaw-openui/frontend ci
          npm --prefix plugins/bundle/qwenpaw-openui/frontend test

      - name: Build memory plugin frontends
        shell: bash
        run: |
          shopt -s nullglob
          for frontend_dir in plugins/memory/*/frontend; do
            if [[ "$frontend_dir" != "$PLUGIN_DIRECTORY/frontend" ]]; then
              continue
            fi
            echo "Building ${frontend_dir}"
            npm --prefix "$frontend_dir" ci
            npm --prefix "$frontend_dir" run build
          done

      - name: Build Run Center frontend
        if: inputs.plugin_id == 'qwenpaw-run-center'
        run: |
          npm --prefix plugins/bundle/qwenpaw-run-center/ui ci
          npm --prefix plugins/bundle/qwenpaw-run-center/ui run build

      - name: Build selected plugin frontend
        if: inputs.plugin_id != 'qwenpaw-openui' && inputs.plugin_id != 'qwenpaw-run-center'
        run: |
          set -euo pipefail
          if [[ "$PLUGIN_DIRECTORY" == plugins/memory/* ]]; then exit 0; fi
          for frontend in "$PLUGIN_DIRECTORY/ui" "$PLUGIN_DIRECTORY/frontend"; do
            if [[ -f "$frontend/package-lock.json" ]]; then
              npm --prefix "$frontend" ci
              npm --prefix "$frontend" run build
            fi
          done
      - name: Install channel contract preflight dependencies
        run: python -m pip install -r scripts/pack/channel-contract-requirements.txt

      - name: Verify shipped brand assets
        run: node console/scripts/verify-brand-assets.mjs

      - name: Pack plugins and build index
        # qwenpaw-creator and qwenpaw-data are released through their own
        # version-driven pipelines (creator-release.yml,
        # qwenpaw-data-release.yml); qwenpaw-data additionally needs the vendored
        # context console staged before packing. Their plugin.json
        # pack_requires declarations make an accidental un-exclude fail
        # this step loudly instead of shipping a broken artifact.
        run: |
          python scripts/pack/generate_plugin_metadata.py \
            --plugins-root plugins \
            --dist dist/plugins \
            --metadata-out dist/plugins/index.json \
            --cdn-prefix /files/plugins \
            --exclude-apps \
            --only "$PLUGIN_ID" \
            --exclude qwenpaw-creator \
            --exclude qwenpaw-data

      - name: Install ossutil
        if: inputs.upload_to_oss
        run: |
          wget -q https://gosspublic.alicdn.com/ossutil/1.7.18/ossutil-v1.7.18-linux-amd64.zip
          unzip -q ossutil-v1.7.18-linux-amd64.zip
          chmod +x ossutil-v1.7.18-linux-amd64/ossutil64
          sudo mv ossutil-v1.7.18-linux-amd64/ossutil64 /usr/local/bin/ossutil
          ossutil --version

      - name: Configure ossutil
        if: inputs.upload_to_oss
        run: |
          ossutil config -e ${{ secrets.OSS_ENDPOINT }} \
            -i ${{ secrets.OSS_ACCESS_KEY_ID }} \
            -k ${{ secrets.OSS_ACCESS_KEY_SECRET }} \
            -L CH

      - name: Read current market index without masking transport failures
        if: inputs.upload_to_oss
        run: |
          set -euo pipefail
          if status=$(ossutil stat "oss://${OSS_BUCKET}/metadata/plugins/index.json" 2>&1); then
            ossutil cp "oss://${OSS_BUCKET}/metadata/plugins/index.json" existing-index.json
          elif grep -Eqi 'StatusCode.?[:=]? ?404|NoSuchKey|ObjectNotExist' <<<"$status"; then
            echo '{}' > existing-index.json
          else
            echo "$status" >&2
            exit 1
          fi

      - name: Advance changed plugin versions automatically
        if: inputs.upload_to_oss
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF_TYPE}" = branch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python scripts/pack/prepare_plugin_versions.py --repo . --dist dist/plugins --index existing-index.json --bucket "$OSS_BUCKET" --commit
          git push origin "HEAD:refs/heads/$RELEASE_BRANCH"
          rm -rf dist/plugins
          python scripts/pack/generate_plugin_metadata.py --plugins-root plugins --dist dist/plugins --metadata-out dist/plugins/index.json --cdn-prefix /files/plugins --exclude-apps --only "$PLUGIN_ID"

      - name: Preflight immutable plugin versions
        if: inputs.upload_to_oss
        run: |
          python scripts/pack/upload_plugin_artifacts.py \
            --root dist/plugins --bucket "$OSS_BUCKET" --reject-apps --preflight

      - name: Sync plugin zips to OSS (long-cache, immutable)
        if: inputs.upload_to_oss
        run: |
          python scripts/pack/upload_plugin_artifacts.py \
            --root dist/plugins --bucket "$OSS_BUCKET" --reject-apps

      - name: Merge historical versions into index
        if: inputs.upload_to_oss
        run: |
          python3 scripts/pack/merge_plugin_index.py \
            --new dist/plugins/index.json \
            --old existing-index.json \
            --out dist/plugins/index.json \
            --retire-plugin-id computer-use-tool \
            --retire-plugin-id qwenpaw-hub \
            --retire-plugin-id clawhub-hub \
            --retire-plugin-id modelscope-hub \
            --retire-plugin-id aliyun-hub

      - name: Upload plugins index (short-cache)
        if: inputs.upload_to_oss
        run: |
          ossutil cp dist/plugins/index.json \
            "oss://${OSS_BUCKET}/metadata/plugins/index.json" \
            --acl public-read \
            --force \
            --meta "Cache-Control:public, max-age=60, must-revalidate"

      - name: Patch main metadata index to advertise plugins product
        if: inputs.upload_to_oss
        run: |
          if stat_out=$(ossutil stat "oss://${OSS_BUCKET}/metadata/index.json" 2>&1); then
            ossutil cp "oss://${OSS_BUCKET}/metadata/index.json" main-index.json
          elif grep -qiE 'NoSuchKey|StatusCode=404' <<< "$stat_out"; then
            printf '%s\n' '{"version":"1.0","updated_at":"","products":{}}' > main-index.json
          else
            echo "::error::Cannot read the authoritative main index"
            echo "$stat_out" >&2
            exit 1
          fi

          python3 scripts/pack/patch_main_index.py \
            --index main-index.json \
            --out   main-index.json

          ossutil cp main-index.json \
            "oss://${OSS_BUCKET}/metadata/index.json" \
            --acl public-read \
            --force \
            --meta "Cache-Control:public, max-age=60, must-revalidate"

      - name: Summary
        if: inputs.upload_to_oss
        run: |
          echo "Plugins published. Index:"
          cat dist/plugins/index.json | python3 -m json.tool | head -40 || true

      - name: Preserve selected plugin artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ inputs.plugin_id }}
          path: dist/plugins
          if-no-files-found: error
