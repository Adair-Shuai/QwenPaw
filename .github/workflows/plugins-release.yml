# Pack repo plugins (bundle/tool) and publish to the download CDN (OSS).
# Runs on any published GitHub Release (including prereleases), same as Desktop OSS upload; also manually via Actions tab.

name: UGSci Plugins Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      upload_to_oss:
        description: "Upload to OSS"
        required: false
        type: boolean
        default: false

concurrency:
  group: plugins-release
  cancel-in-progress: false

jobs:
  upload-oss:
    runs-on: ubuntu-latest
    env:
      OSS_BUCKET: ${{ vars.OSS_BUCKET || 'ugsci-download' }}
    # Run on: 1) any published release (including prerelease), or 2) manual with upload_to_oss.
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.upload_to_oss == 'true')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pack plugins and build index
        run: |
          python scripts/pack/generate_plugin_metadata.py \
            --plugins-root plugins \
            --dist dist/plugins \
            --metadata-out dist/plugins/index.json \
            --cdn-prefix /files/plugins

      - name: Install ossutil
        run: |
          wget -q https://gosspublic.alicdn.com/ossutil/1.7.18/ossutil-v1.7.18-linux-amd64.zip
          unzip -q ossutil-v1.7.18-linux-amd64.zip
          chmod +x ossutil-v1.7.18-linux-amd64/ossutil64
          sudo mv ossutil-v1.7.18-linux-amd64/ossutil64 /usr/local/bin/ossutil
          ossutil --version

      - name: Configure ossutil
        run: |
          ossutil config -e ${{ secrets.OSS_ENDPOINT }} \
            -i ${{ secrets.OSS_ACCESS_KEY_ID }} \
            -k ${{ secrets.OSS_ACCESS_KEY_SECRET }} \
            -L CH

      - name: Sync plugin zips to OSS (long-cache, immutable)
        run: |
          # nullglob ensures empty globs expand to nothing in this bash session
          shopt -s nullglob
          for kind in bundle tool apps; do
            while IFS= read -r -d '' f; do
              rel="${f#dist/plugins/}"
              echo "Uploading $f -> files/plugins/${rel}"
              ossutil cp "$f" \
                "oss://${OSS_BUCKET}/files/plugins/${rel}" \
                --acl public-read \
                --force \
                --meta "Cache-Control:public, max-age=31536000, immutable"
            done < <(find "dist/plugins/${kind}" -type f -name '*.zip' -print0 2>/dev/null || true)
          done
          # One-time cleanup: remove legacy flat zips (pre per-plugin directory layout).
          # This only targets {kind}/*.zip (flat files), not {kind}/{plugin_id}/*.zip (versioned).
          for kind in bundle tool apps; do
            remote_flat=$(ossutil ls "oss://${OSS_BUCKET}/files/plugins/${kind}/" -s 2>/dev/null \
              | grep -E "^oss://${OSS_BUCKET}/files/plugins/${kind}/[^/]+\.zip$" \
              | sed 's|.*/||' \
              | sort -u || true)
            for name in $remote_flat; do
              echo "Removing legacy flat OSS object: ${kind}/${name}"
              ossutil rm \
                "oss://${OSS_BUCKET}/files/plugins/${kind}/${name}" \
                --force
            done
          done

      - name: Download existing index for cleanup reference
        run: |
          ossutil cp "oss://${OSS_BUCKET}/metadata/plugins/index.json" \
            existing-index.json 2>/dev/null || echo '{}' > existing-index.json

      - name: Clean up old plugin versions and removed plugins from OSS
        env:
          OSS_BUCKET: ${{ env.OSS_BUCKET }}
        run: |
          # Delete ALL old version zips from OSS so that only the latest
          # version of each plugin (and only currently-published plugins)
          # remains on the CDN.
          python3 - << 'PYEOF'
          import json, os, subprocess, sys

          bucket = os.environ['OSS_BUCKET']

          with open('existing-index.json') as f:
              old = json.load(f)
          with open('dist/plugins/index.json') as f:
              new = json.load(f)

          # Build a set of (kind, plugin_id, filename) that should be kept
          keep = set()
          for entry in new.get('files', {}).values():
              pid = entry.get('plugin_id')
              kind = entry.get('platform')  # 'bundle', 'tool', 'apps'
              fname = entry.get('filename')
              if pid and kind and fname:
                  keep.add((kind, pid, fname))

          # Plugins that existed before but are no longer published
          old_ids = {(v.get('platform'), v.get('plugin_id')) for v in old.get('files', {}).values() if v.get('plugin_id')}
          new_ids = {(v.get('platform'), v.get('plugin_id')) for v in new.get('files', {}).values() if v.get('plugin_id')}
          removed = old_ids - new_ids

          if removed:
              print(f'Removed plugins to clean from OSS: {removed}')
              for kind, plugin_id in removed:
                  prefix = f"oss://{bucket}/files/plugins/{kind}/{plugin_id}/"
                  result = subprocess.run(
                      ['ossutil', 'ls', prefix, '-s'],
                      capture_output=True, text=True
                  )
                  for line in result.stdout.strip().split('\n'):
                      line = line.strip()
                      if line.startswith('oss://'):
                          print(f'  Deleting removed plugin: {line}')
                          subprocess.run(
                              ['ossutil', 'rm', line, '--force'],
                              capture_output=True, text=True
                          )

          # For each currently published plugin, delete old version zips
          for kind, plugin_id, fname in keep:
              prefix = f"oss://{bucket}/files/plugins/{kind}/{plugin_id}/"
              result = subprocess.run(
                  ['ossutil', 'ls', prefix, '-s'],
                  capture_output=True, text=True
              )
              for line in result.stdout.strip().split('\n'):
                  line = line.strip()
                  if not line.startswith('oss://'):
                      continue
                  remote_fname = line.rsplit('/', 1)[-1]
                  if remote_fname == fname:
                      continue  # keep current version
                  print(f'  Deleting old version: {line}')
                  subprocess.run(
                      ['ossutil', 'rm', line, '--force'],
                      capture_output=True, text=True
                  )

          print('✓ Old plugin versions cleaned up')
          PYEOF

      - name: Upload plugins index (short-cache)
        run: |
          ossutil cp dist/plugins/index.json \
            "oss://${OSS_BUCKET}/metadata/plugins/index.json" \
            --acl public-read \
            --force \
            --meta "Cache-Control:public, max-age=60, must-revalidate"

      - name: Patch main metadata index to advertise plugins product
        run: |
          ossutil cp "oss://${OSS_BUCKET}/metadata/index.json" \
            main-index.json 2>/dev/null || cat > main-index.json << 'EOF'
          {
            "version": "1.0",
            "updated_at": "",
            "products": {}
          }
          EOF

          python3 scripts/pack/patch_main_index.py \
            --index main-index.json \
            --out   main-index.json

          ossutil cp main-index.json \
            "oss://${OSS_BUCKET}/metadata/index.json" \
            --acl public-read \
            --force \
            --meta "Cache-Control:public, max-age=60, must-revalidate"

      - name: Summary
        run: |
          echo "Plugins published. Index:"
          cat dist/plugins/index.json | python3 -m json.tool | head -40 || true
