# Clean up old desktop versions from OSS, keeping only the latest build.
#
# Triggered manually via workflow_dispatch. Uses the same ossutil approach
# as the cleanup step in desktop-release.yml, but as a standalone job so
# a full rebuild is not required.

name: OSS Cleanup

on:
  workflow_dispatch:
    inputs:
      keep_version:
        description: 'Version to keep, or purge-unpublished:<version> to remove only an abandoned draft build'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      OSS_BUCKET: ${{ vars.OSS_BUCKET || 'ugsci-download' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Get version
        id: version
        shell: bash
        run: |
          requested='${{ inputs.keep_version }}'
          if [[ "$requested" == purge-unpublished:* ]]; then
            version="${requested#purge-unpublished:}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+b[0-9]+$ ]]; then
              echo "::error::Invalid unpublished version: $version"
              exit 1
            fi
            echo "mode=purge-unpublished" >> "$GITHUB_OUTPUT"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
          elif [ -n "$requested" ]; then
            echo "mode=cleanup-old" >> "$GITHUB_OUTPUT"
            echo "version=${requested}" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(grep -oP '__version__\s*=\s*"\K[^"]+' src/qwenpaw/__version__.py)
            echo "mode=cleanup-old" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install ossutil
        run: |
          wget https://gosspublic.alicdn.com/ossutil/1.7.18/ossutil-v1.7.18-linux-amd64.zip
          unzip ossutil-v1.7.18-linux-amd64.zip
          chmod +x ossutil-v1.7.18-linux-amd64/ossutil64
          sudo mv ossutil-v1.7.18-linux-amd64/ossutil64 /usr/local/bin/ossutil
          ossutil --version

      - name: Configure ossutil
        run: |
          ossutil config -e ${{ secrets.OSS_ENDPOINT }} \
            -i ${{ secrets.OSS_ACCESS_KEY_ID }} \
            -k ${{ secrets.OSS_ACCESS_KEY_SECRET }} \
            -L CH

      - name: List all desktop files before cleanup
        if: steps.version.outputs.mode == 'cleanup-old'
        run: |
          echo "=== Files before cleanup ==="
          for prefix in \
            "oss://${OSS_BUCKET}/files/apps/desktop/" \
            "oss://${OSS_BUCKET}/metadata/apps/desktop/"; do
            echo "--- ${prefix} ---"
            ossutil ls "${prefix}" -s 2>/dev/null || true
          done

      - name: Clean up old desktop versions
        if: steps.version.outputs.mode == 'cleanup-old'
        env:
          OSS_BUCKET: ${{ env.OSS_BUCKET }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - << 'PYEOF'
          import os, subprocess

          bucket = os.environ['OSS_BUCKET']
          version = os.environ['VERSION']
          # Keep files matching current version, "latest", or essential
          # non-versioned files like index.json and the updater manifest.
          keep_patterns = [version, 'latest', 'index.json', 'qwenpaw-tauri-latest.json']

          dirs_to_clean = [
              f"oss://{bucket}/files/apps/desktop/win/",
              f"oss://{bucket}/files/apps/desktop/mac/",
              f"oss://{bucket}/files/apps/desktop/win-tauri/",
              f"oss://{bucket}/files/apps/desktop/mac-tauri/",
              f"oss://{bucket}/metadata/apps/desktop/win/",
              f"oss://{bucket}/metadata/apps/desktop/mac/",
              f"oss://{bucket}/metadata/apps/desktop/win-tauri/",
              f"oss://{bucket}/metadata/apps/desktop/mac-tauri/",
              f"oss://{bucket}/metadata/apps/desktop/",
          ]

          deleted = 0
          kept = 0
          for prefix in dirs_to_clean:
              result = subprocess.run(
                  ['ossutil', 'ls', prefix, '-s'],
                  capture_output=True, text=True
              )
              for line in result.stdout.strip().split('\n'):
                  line = line.strip()
                  if not line.startswith('oss://'):
                      continue
                  filename = line.rsplit('/', 1)[-1]
                  if any(p in filename for p in keep_patterns):
                      print(f"  KEEP: {line}")
                      kept += 1
                      continue
                  print(f"  DELETE: {line}")
                  subprocess.run(
                      ['ossutil', 'rm', line, '--force'],
                      capture_output=True, text=True
                  )
                  deleted += 1

          print(f"\n✓ Cleanup complete: {deleted} deleted, {kept} kept (version={version})")
          PYEOF

      - name: Purge abandoned unpublished desktop version
        if: steps.version.outputs.mode == 'purge-unpublished'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          OSS_BUCKET: ${{ env.OSS_BUCKET }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          base="${VERSION%b*}"
          beta="${VERSION##*b}"
          tag="v${base}-beta.${beta}"
          is_draft="$(gh api "repos/${REPOSITORY}/releases/tags/${tag}" --jq '.draft')"
          if [ "$is_draft" != "true" ]; then
            echo "::error::Refusing to purge ${VERSION}: ${tag} is not a draft release"
            exit 1
          fi

          keys=(
            "files/apps/desktop/win-tauri/UGSci-Tauri-${VERSION}-Windows-portable.zip"
            "files/apps/desktop/win-tauri/UGSci-Tauri-${VERSION}-Windows-updater.exe"
            "files/apps/desktop/mac-tauri/UGSci-Tauri-${VERSION}-macOS.zip"
            "files/apps/desktop/mac-tauri/UGSci-Tauri-${VERSION}-macOS.app.tar.gz"
            "metadata/apps/desktop/win-tauri/UGSci-Tauri-${VERSION}-Windows-portable.zip.json"
            "metadata/apps/desktop/win-tauri/UGSci-Tauri-${VERSION}-Windows-updater.exe.json"
            "metadata/apps/desktop/mac-tauri/UGSci-Tauri-${VERSION}-macOS.zip.json"
            "metadata/apps/desktop/mac-tauri/UGSci-Tauri-${VERSION}-macOS.app.tar.gz.json"
          )
          for key in "${keys[@]}"; do
            uri="oss://${OSS_BUCKET}/${key}"
            if ossutil stat "$uri" >/dev/null 2>&1; then
              echo "Deleting abandoned draft object: ${key}"
              ossutil rm "$uri" --force
            else
              echo "Already absent: ${key}"
            fi
            if ossutil stat "$uri" >/dev/null 2>&1; then
              echo "::error::Failed to delete ${key}"
              exit 1
            fi
          done

      - name: List remaining desktop files after cleanup
        if: steps.version.outputs.mode == 'cleanup-old'
        run: |
          echo "=== Files after cleanup ==="
          for prefix in \
            "oss://${OSS_BUCKET}/files/apps/desktop/" \
            "oss://${OSS_BUCKET}/metadata/apps/desktop/"; do
            echo "--- ${prefix} ---"
            ossutil ls "${prefix}" -s 2>/dev/null || true
          done
