# Reusable "promote" step of the desktop release — runs ONLY after the release
# has been flipped to published (called by release.yml's post-finalize job).
#
# It promotes the already-uploaded versioned OSS files to `latest`, generates
# and uploads the Tauri auto-update manifest (qwenpaw-tauri-latest.json), and
# refreshes the desktop + main index. Splitting this out of desktop-publish.yml
# ensures existing users' auto-updater is never pointed at a version whose
# release publishing might still have failed.
#
# Skipped entirely when dry_run=true (fork verification never touches prod OSS).

name: Desktop Promote (reusable)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release tag"
        required: true
        type: string
      ref:
        description: "Ref/SHA containing promotion scripts"
        required: false
        default: release
        type: string
      artifacts_run_id:
        description: "Completed full build run containing macOS artifacts"
        required: true
        type: string
      windows_artifacts_run_id:
        description: "Optional Windows-only run replacing Windows artifacts"
        required: false
        default: ""
        type: string
      macos_artifacts_run_id:
        description: "Optional macOS-only run replacing macOS artifacts"
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      tag:
        description: "Published release tag (for updater manifest notes)"
        type: string
        required: true
      ref:
        description: "Git ref/SHA to checkout for the packaging scripts"
        type: string
        required: false
        default: ""
      dry_run:
        description: "Skip promotion entirely (fork verification)"
        type: boolean
        required: false
        default: false
      artifacts_run_id:
        type: string
        required: false
        default: ""
      windows_artifacts_run_id:
        type: string
        required: false
        default: ""
      macos_artifacts_run_id:
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  promote-oss:
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    concurrency:
      group: oss-production-metadata
      cancel-in-progress: false
    env:
      OSS_BUCKET: ${{ vars.OSS_BUCKET || 'ugsci-download' }}
      OSS_PUBLIC_BASE_URL: ${{ vars.OSS_PUBLIC_BASE_URL || 'https://ugsci-download.oss-cn-beijing.aliyuncs.com/files/apps/desktop' }}
    steps:
      - name: Checkout (for scripts)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packaging helper dependencies
        run: python -m pip install packaging

      - name: Get version
        id: version
        uses: ./.github/actions/get-version

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.artifacts_run_id || github.event.inputs.artifacts_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Overlay replacement Windows artifacts
        if: ${{ inputs.windows_artifacts_run_id != '' || github.event.inputs.windows_artifacts_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          pattern: UGSci-Desktop-Tauri-Windows-*
          path: replacement-windows
          merge-multiple: false
          run-id: ${{ inputs.windows_artifacts_run_id || github.event.inputs.windows_artifacts_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Overlay replacement Windows updater metadata
        if: ${{ inputs.windows_artifacts_run_id != '' || github.event.inputs.windows_artifacts_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: tauri-updater-meta-windows
          path: replacement-windows/tauri-updater-meta-windows
          run-id: ${{ inputs.windows_artifacts_run_id || github.event.inputs.windows_artifacts_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Overlay replacement macOS artifacts
        if: ${{ inputs.macos_artifacts_run_id != '' || github.event.inputs.macos_artifacts_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          pattern: UGSci-Desktop-Tauri-macOS-*
          path: replacement-macos
          merge-multiple: false
          run-id: ${{ inputs.macos_artifacts_run_id || github.event.inputs.macos_artifacts_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Overlay replacement macOS updater metadata
        if: ${{ inputs.macos_artifacts_run_id != '' || github.event.inputs.macos_artifacts_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: tauri-updater-meta-macos
          path: replacement-macos/tauri-updater-meta-macos
          run-id: ${{ inputs.macos_artifacts_run_id || github.event.inputs.macos_artifacts_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge replacement Windows artifacts
        if: ${{ inputs.windows_artifacts_run_id != '' || github.event.inputs.windows_artifacts_run_id != '' }}
        run: |
          rm -rf UGSci-Desktop-Tauri-Windows-* tauri-updater-meta-windows
          # Preserve the artifact directory names; promotion discovers files
          # beneath UGSci-Desktop-Tauri-Windows-* and updater metadata under
          # tauri-updater-meta-windows.
          cp -a replacement-windows/UGSci-Desktop-Tauri-Windows-* .
          cp -a replacement-windows/tauri-updater-meta-windows .

      - name: Merge replacement macOS artifacts
        if: ${{ inputs.macos_artifacts_run_id != '' || github.event.inputs.macos_artifacts_run_id != '' }}
        run: |
          rm -rf UGSci-Desktop-Tauri-macOS-* tauri-updater-meta-macos
          cp -a replacement-macos/UGSci-Desktop-Tauri-macOS-* .
          cp -a replacement-macos/tauri-updater-meta-macos .

      - name: Re-verify final macOS archives before pointer promotion
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mac_zips=(UGSci-Desktop-Tauri-macOS-*/UGSci-Tauri-*-macOS.zip)
          mac_updaters=(tauri-updater-meta-macos/UGSci-Tauri-*-macOS.app.tar.gz)
          if [ "${#mac_zips[@]}" -ne 1 ] || [ "${#mac_updaters[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one macOS ZIP and updater archive; found ${#mac_zips[@]} ZIP(s), ${#mac_updaters[@]} updater archive(s)"
            exit 1
          fi
          python scripts/pack-tauri/verify_frozen_plugins.py --archive "${mac_zips[0]}"
          python scripts/pack-tauri/verify_frozen_plugins.py --archive "${mac_updaters[0]}"

      - name: Install ossutil
        run: |
          wget https://gosspublic.alicdn.com/ossutil/1.7.18/ossutil-v1.7.18-linux-amd64.zip
          unzip ossutil-v1.7.18-linux-amd64.zip
          chmod +x ossutil-v1.7.18-linux-amd64/ossutil64
          sudo mv ossutil-v1.7.18-linux-amd64/ossutil64 /usr/local/bin/ossutil
          ossutil --version

      - name: Configure ossutil
        run: |
          ossutil config -e ${{ secrets.OSS_ENDPOINT }} \
            -i ${{ secrets.OSS_ACCESS_KEY_ID }} \
            -k ${{ secrets.OSS_ACCESS_KEY_SECRET }} \
            -L CH

      - name: Prevent desktop pointer downgrade
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if ossutil cp "oss://${OSS_BUCKET}/metadata/apps/desktop/index.json" current-desktop-index.json >/dev/null 2>&1; then
            python - "$VERSION" current-desktop-index.json <<'PY'
          import json
          import sys
          from packaging.version import Version

          candidate = Version(sys.argv[1])
          index = json.load(open(sys.argv[2], encoding="utf-8"))
          files = index.get("files", {})
          for platform in ("win-tauri", "mac-tauri"):
              latest = index.get("platforms", {}).get(platform, {}).get("latest")
              current = files.get(latest, {}).get("version") if latest else None
              if current and candidate < Version(current):
                  raise SystemExit(
                      f"refusing desktop pointer downgrade for {platform}: {current} -> {candidate}"
                  )
          PY
          fi

      - name: Snapshot mutable desktop pointers
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/desktop-pointer-backup"
          : > "$RUNNER_TEMP/desktop-pointer-existing.txt"
          cat > "$RUNNER_TEMP/desktop-pointer-paths.txt" <<'EOF'
          files/apps/desktop/win-tauri/UGSci-Tauri-latest-Windows-updater.exe
          files/apps/desktop/win-tauri/UGSci-Tauri-latest-Windows-portable.zip
          files/apps/desktop/mac-tauri/UGSci-Tauri-latest-macOS.zip
          metadata/apps/desktop/win-tauri/UGSci-Tauri-latest-Windows-updater.exe.json
          metadata/apps/desktop/win-tauri/UGSci-Tauri-latest-Windows-portable.zip.json
          metadata/apps/desktop/mac-tauri/UGSci-Tauri-latest-macOS.zip.json
          metadata/qwenpaw-tauri-latest.json
          metadata/apps/desktop/index.json
          metadata/index.json
          EOF
          while IFS= read -r object; do
            backup="$RUNNER_TEMP/desktop-pointer-backup/$object"
            mkdir -p "$(dirname "$backup")"
            if ossutil cp "oss://${OSS_BUCKET}/${object}" "$backup" >/dev/null 2>&1; then
              echo "$object" >> "$RUNNER_TEMP/desktop-pointer-existing.txt"
            fi
          done < "$RUNNER_TEMP/desktop-pointer-paths.txt"

      - name: Promote versioned files to latest
        if: hashFiles('UGSci-Desktop-Tauri-*/*') != ''
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          promote_latest() {
            local dirs="$1"
            local pattern="$2"
            local platform="$3"
            local versioned_name="$4"
            local latest_name="$5"

            local artifact
            artifact=$(find ${dirs} -name "${pattern}" 2>/dev/null | head -1 || true)
            if [ -z "${artifact}" ]; then
              echo "No ${platform} artifact; skipping latest promotion"
              return 0
            fi

            echo "Promoting ${platform} ${versioned_name} -> ${latest_name}"
            tmp_suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            latest_uri="oss://${OSS_BUCKET}/files/apps/desktop/${platform}/${latest_name}"
            latest_tmp="${latest_uri}.staging-${tmp_suffix}"
            metadata_uri="oss://${OSS_BUCKET}/metadata/apps/desktop/${platform}/${latest_name}.json"
            metadata_tmp="${metadata_uri}.staging-${tmp_suffix}"
            # The versioned metadata points at the immutable versioned object.
            # Rewrite the alias metadata so consumers following `url` download
            # the same latest object that was just promoted.
            versioned_metadata="${RUNNER_TEMP}/${platform}-versioned-metadata.json"
            latest_metadata="${RUNNER_TEMP}/${platform}-latest-metadata.json"
            ossutil cp \
              "oss://${OSS_BUCKET}/metadata/apps/desktop/${platform}/${versioned_name}.json" \
              "$versioned_metadata"
            python -c 'import json,sys; from pathlib import Path; source,destination,latest_name,platform=sys.argv[1:]; doc=json.loads(Path(source).read_text(encoding="utf-8")); doc["filename"]=latest_name; doc["url"]=f"/files/apps/desktop/{platform}/{latest_name}"; Path(destination).write_text(json.dumps(doc, ensure_ascii=False, indent=2)+"\n", encoding="utf-8")' \
              "$versioned_metadata" "$latest_metadata" "$latest_name" "$platform"
            ossutil cp \
              "oss://${OSS_BUCKET}/files/apps/desktop/${platform}/${versioned_name}" \
              "$latest_tmp" \
              --acl public-read
            ossutil cp "$latest_metadata" "$metadata_tmp" --acl public-read
            ossutil ls "$latest_tmp" >/dev/null
            ossutil ls "$metadata_tmp" >/dev/null
            ossutil cp "$latest_tmp" "$latest_uri" --acl public-read --force
            ossutil cp "$metadata_tmp" "$metadata_uri" --acl public-read --force --meta "Cache-Control:public, max-age=0, must-revalidate"
            ossutil rm "$latest_tmp" --force || true
            ossutil rm "$metadata_tmp" --force || true
          }

          promote_latest \
            "UGSci-Desktop-Tauri-Windows-*" \
            "UGSci-Tauri-*-Windows-updater.exe" \
            "win-tauri" \
            "UGSci-Tauri-${VERSION}-Windows-updater.exe" \
            "UGSci-Tauri-latest-Windows-updater.exe"

          promote_latest \
            "UGSci-Desktop-Tauri-Windows-*" \
            "UGSci-Tauri-*-Windows-portable.zip" \
            "win-tauri" \
            "UGSci-Tauri-${VERSION}-Windows-portable.zip" \
            "UGSci-Tauri-latest-Windows-portable.zip"

          promote_latest \
            "UGSci-Desktop-Tauri-macOS-*" \
            "UGSci-Tauri-*-macOS.zip" \
            "mac-tauri" \
            "UGSci-Tauri-${VERSION}-macOS.zip" \
            "UGSci-Tauri-latest-macOS.zip"

      - name: Link artifacts into updater-meta dirs for manifest generation
        if: hashFiles('tauri-updater-meta-*/tauri-*-updater.json') != ''
        run: |
          # The manifest generator expects the artifact binary alongside the
          # sidecar JSON.  After artifact splitting the exe lives in a separate
          # artifact directory, so we symlink it into the meta directory.
          for f in UGSci-Desktop-Tauri-Windows-*/UGSci-Tauri-*-Windows-updater.exe; do
            [ -f "$f" ] && ln -sf "../$f" tauri-updater-meta-windows/ 2>/dev/null || true
          done
          for f in UGSci-Desktop-Tauri-Windows-*/UGSci-Tauri-*-Windows-portable.zip; do
            [ -f "$f" ] && ln -sf "../$f" tauri-updater-meta-windows/ 2>/dev/null || true
          done

      - name: Generate and upload OSS updater manifest
        # The Tauri auto-updater uses OSS only; GitHub Releases only carry
        # first-install artifacts.
        if: hashFiles('tauri-updater-meta-*/tauri-*-updater.json') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A unified Tauri manifest has one global version. Publishing it with
          # only the new macOS entry would either remove Windows support or
          # mislabel an old Windows artifact as the new version. Both NSIS and
          # the portable ZIP now have a signed updater sidecar; keep the
          # current complete manifest unchanged until both platforms exist.
          if [ ! -s tauri-updater-meta-windows/tauri-windows-x86_64-updater.json ] || \
             [ ! -s tauri-updater-meta-macos/tauri-darwin-aarch64-updater.json ]; then
            echo "Signed updater assets are incomplete; preserving the current OSS updater manifest"
            exit 0
          fi
          VERSION="${{ steps.version.outputs.version }}"
          RELEASE_BODY="$(gh release view "${{ inputs.tag }}" --json body -q .body --repo "$GITHUB_REPOSITORY" 2>/dev/null || true)"
          OSS_BASE="${OSS_PUBLIC_BASE_URL%/}"
          metadata_args=()
          for f in tauri-updater-meta-windows/tauri-windows-*-updater.json \
                   tauri-updater-meta-macos/tauri-darwin-*-updater.json; do
            [ -f "$f" ] || continue
            target=$(jq -r '.target // empty' "$f")
            artifact=$(jq -r '.artifact // empty' "$f")
            case "$target" in
              windows-x86_64) platform="win-tauri" ;;
              darwin-aarch64|darwin-x86_64) platform="mac-tauri" ;;
              *)
                echo "::error::Unsupported updater target in $f: $target"
                exit 1
                ;;
            esac
            if [ -z "$artifact" ] || ! ossutil ls \
                "oss://${OSS_BUCKET}/files/apps/desktop/${platform}/${artifact}" \
                >/dev/null 2>&1; then
              echo "::error::Updater artifact is missing from OSS: ${platform}/${artifact}"
              exit 1
            fi
            metadata_args+=(--metadata "$f")
          done
          if [ ${#metadata_args[@]} -eq 0 ]; then
            echo "No Tauri updater sidecars found, skipping OSS manifest"
            exit 0
          fi
          NOTES="${RELEASE_BODY:-UGSci Desktop ${VERSION}}"
          python scripts/pack-tauri/generate_update_manifest.py manifest \
            --version "$VERSION" \
            --base-url "$OSS_BASE" \
            --target-base "windows-x86_64=${OSS_BASE}/win-tauri" \
            --target-base "darwin-aarch64=${OSS_BASE}/mac-tauri" \
            "${metadata_args[@]}" \
            --notes "$NOTES" \
            --output qwenpaw-tauri-latest-oss.json
          updater_uri="oss://${OSS_BUCKET}/metadata/qwenpaw-tauri-latest.json"
          updater_tmp="${updater_uri}.staging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ossutil cp qwenpaw-tauri-latest-oss.json "$updater_tmp" --acl public-read
          ossutil ls "$updater_tmp" >/dev/null
          ossutil cp "$updater_tmp" "$updater_uri" --acl public-read --force --meta "Cache-Control:public, max-age=0, must-revalidate"
          ossutil rm "$updater_tmp" --force || true

      - name: Update desktop index
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          RELEASE_UPDATED_AT="$(git show -s --format=%cI HEAD)"

          # Download existing desktop/index.json if exists
          ossutil cp "oss://${OSS_BUCKET}/metadata/apps/desktop/index.json" \
            desktop-index.json 2>/dev/null || cat > desktop-index.json << 'EOF'
          {
            "product": "desktop",
            "updated_at": "",
            "platforms": {},
            "files": {}
          }
          EOF

          merge_tauri_metadata() {
            local metadata="$1"
            local dirs="$2"
            local pattern="$3"
            local platform="$4"
            local artifact
            artifact=$(find ${dirs} -name "${pattern}" 2>/dev/null | head -1 || true)
            if [ -z "${artifact}" ]; then
              return 0
            fi
            python scripts/pack/generate_oss_metadata.py \
              --file "${artifact}" \
              --product desktop \
              --platform "${platform}" \
              --version "$VERSION" \
              --updated-at "$RELEASE_UPDATED_AT" \
              --output "${metadata}" \
              --merge-index desktop-index.json \
              --output-index desktop-index.json
          }

          merge_tauri_metadata \
            "win-tauri-portable-metadata.json" \
            "UGSci-Desktop-Tauri-Windows-*" \
            "UGSci-Tauri-*-Windows-portable.zip" \
            "win-tauri"
          merge_tauri_metadata \
            "mac-tauri-metadata.json" \
            "UGSci-Desktop-Tauri-macOS-*" \
            "UGSci-Tauri-*-macOS.zip" \
            "mac-tauri"

          # Upload updated desktop/index.json
          index_uri="oss://${OSS_BUCKET}/metadata/apps/desktop/index.json"
          index_tmp="${index_uri}.staging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ossutil cp desktop-index.json "$index_tmp" --acl public-read
          ossutil ls "$index_tmp" >/dev/null
          ossutil cp "$index_tmp" "$index_uri" --acl public-read --force --meta "Cache-Control:public, max-age=0, must-revalidate"
          ossutil rm "$index_tmp" --force || true

          echo "✓ Desktop index updated"

      - name: Update main index
        run: |
          # Download main index if exists
          ossutil cp "oss://${OSS_BUCKET}/metadata/index.json" \
            main-index.json 2>/dev/null || cat > main-index.json << 'EOF'
          {
            "version": "1.0",
            "updated_at": "",
            "products": {}
          }
          EOF

          # Ensure desktop product is in main index
          python3 << 'PYTHON'
          import json
          from datetime import datetime, timezone

          with open("main-index.json", "r") as f:
              index = json.load(f)

          index["updated_at"] = datetime.now(timezone.utc).isoformat()

          if "desktop" not in index["products"]:
              index["products"]["desktop"] = {
                  "name": {
                      "zh-CN": "桌面客户端",
                      "en-US": "Desktop Client"
                  },
                  "index_url": "/metadata/apps/desktop/index.json"
              }

          with open("main-index.json", "w") as f:
              json.dump(index, f, indent=2, ensure_ascii=False)
          PYTHON

          # Upload main index
          index_uri="oss://${OSS_BUCKET}/metadata/index.json"
          index_tmp="${index_uri}.staging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ossutil cp main-index.json "$index_tmp" --acl public-read
          ossutil ls "$index_tmp" >/dev/null
          ossutil cp "$index_tmp" "$index_uri" --acl public-read --force --meta "Cache-Control:public, max-age=0, must-revalidate"
          ossutil rm "$index_tmp" --force || true

          echo "Main index updated"

      - name: Roll back mutable desktop pointers on failure
        if: ${{ failure() }}
        run: |
          set +e
          while IFS= read -r object; do
            backup="$RUNNER_TEMP/desktop-pointer-backup/$object"
            uri="oss://${OSS_BUCKET}/${object}"
            if grep -Fxq "$object" "$RUNNER_TEMP/desktop-pointer-existing.txt"; then
              ossutil cp "$backup" "$uri" --acl public-read --force \
                --meta "Cache-Control:public, max-age=0, must-revalidate"
            else
              ossutil rm "$uri" --force >/dev/null 2>&1 || true
            fi
          done < "$RUNNER_TEMP/desktop-pointer-paths.txt"
          echo "Mutable desktop pointers restored after promotion failure"
