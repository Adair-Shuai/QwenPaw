name: Component Release

on:
  workflow_call:
    inputs:
      target:
        type: string
        required: false
        default: ""
      ref:
        type: string
        required: false
        default: ""
      core_min_version:
        type: string
        required: true
      release_id:
        type: string
        required: true
      upload_to_oss:
        type: boolean
        required: false
        default: false
      history_count:
        type: number
        required: false
        default: 10
      delta_max_ratio:
        type: string
        required: false
        default: "0.8"
      include_desktop_components:
        description: Include versioned backend/runtime/tool layers from desktop build artifacts
        type: boolean
        required: false
        default: false
      windows_desktop_artifacts_run_id:
        description: Optional standalone Desktop Build run containing Windows component source
        type: string
        required: false
        default: ""
      macos_desktop_artifacts_run_id:
        description: Optional standalone Desktop Build run containing macOS component source
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      target:
        description: Component target
        type: choice
        options: [all, windows-x86_64, macos-aarch64]
        required: true
        default: all
      core_min_version:
        description: Minimum compatible desktop core version
        required: true
      upload_to_oss:
        description: Upload signed artifacts and publish manifest
        type: boolean
        default: false
      history_count:
        description: Historical releases used for direct deltas (1-10)
        type: number
        default: 10
      delta_max_ratio:
        description: Skip deltas at or above this fraction of full size
        type: string
        default: "0.8"
      include_desktop_components:
        description: Include backend, runtime and tool layers from Desktop Build artifacts
        type: boolean
        default: true
      windows_desktop_artifacts_run_id:
        description: Successful Desktop Build run ID for Windows component source
        required: false
        type: string
        default: ""
      macos_desktop_artifacts_run_id:
        description: Successful Desktop Build run ID for macOS component source
        required: false
        type: string
        default: ""

permissions:
  actions: read
  contents: read

concurrency:
  # Only direct workflows that actually upload a pointer take the global
  # promotion lock.  Reusable build-only calls use a run-local group so they
  # cannot deadlock with the unified release workflow that invoked them.
  group: ${{ inputs.upload_to_oss && 'oss-production-metadata' || format('component-build-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  build-components:
    strategy:
      fail-fast: false
      matrix:
        # Build all targets for unified releases, or exactly the requested
        # target for a manual/single-target invocation.  This is expressed in
        # the matrix itself because job-level `if` is evaluated before matrix
        # expansion and cannot safely reference `matrix.target`.
        target: ${{ fromJSON((inputs.target == '' || inputs.target == 'all') && '["windows-x86_64","macos-aarch64"]' || format('["{0}"]', inputs.target)) }}
    runs-on: ubuntu-latest
    env:
      COMPONENT_BASE_URL: ${{ vars.COMPONENT_BASE_URL || 'https://ugsci-download.oss-cn-beijing.aliyuncs.com' }}
      # This must stay byte-for-byte aligned with the trust root embedded in
      # src/qwenpaw/components/service.py. It prevents a mistyped/rotated
      # private-key Secret from publishing updates no installed client trusts.
      COMPONENT_SIGNING_PUBLIC_KEY: T0VO6V4iNHzSxU3eV68N4nifjq2CqtDfMO0QPtH72mw=
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install release dependencies
        run: python -m pip install packaging cryptography

      - name: Stage managed bundled plugins and apps
        run: |
          python scripts/pack-tauri/stage_bundled_plugins.py \
            --repo . \
            --dest component-staging \
            --plugin-roots bundle apps

      - name: Resolve desktop component artifact source
        if: ${{ inputs.include_desktop_components }}
        id: desktop-source
        env:
          WINDOWS_RUN_ID: ${{ inputs.windows_desktop_artifacts_run_id }}
          MACOS_RUN_ID: ${{ inputs.macos_desktop_artifacts_run_id }}
        run: |
          set -euo pipefail
          case '${{ matrix.target }}' in
            windows-x86_64) run_id="$WINDOWS_RUN_ID" ;;
            macos-aarch64) run_id="$MACOS_RUN_ID" ;;
            *) echo "::error::Unsupported desktop component target: ${{ matrix.target }}"; exit 1 ;;
          esac
          if [ -z "$run_id" ]; then
            echo "::error::Complete component builds require a Desktop Build run ID for ${{ matrix.target }}"
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          if [ "$run_id" = "$GITHUB_RUN_ID" ]; then
            echo "external=false" >> "$GITHUB_OUTPUT"
          else
            echo "external=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate external Desktop Build artifact source
        if: ${{ inputs.include_desktop_components && steps.desktop-source.outputs.external == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ steps.desktop-source.outputs.run_id }}
        run: |
          set -euo pipefail
          source_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          test "$(jq -r .status <<<"$source_run")" = completed || {
            echo "::error::Desktop Build run $SOURCE_RUN_ID is not complete"
            exit 1
          }
          test "$(jq -r .conclusion <<<"$source_run")" = success || {
            echo "::error::Desktop Build run $SOURCE_RUN_ID did not succeed"
            exit 1
          }
          test "$(jq -r .path <<<"$source_run")" = '.github/workflows/desktop-build.yml' || {
            echo "::error::Desktop component source must come from desktop-build.yml"
            exit 1
          }
          expected_sha="$(git rev-parse HEAD)"
          test "$(jq -r .head_sha <<<"$source_run")" = "$expected_sha" || {
            echo "::error::Desktop Build run $SOURCE_RUN_ID was not built from $expected_sha"
            exit 1
          }
          case '${{ matrix.target }}' in
            windows-x86_64) expected_job='build-tauri-windows' ;;
            macos-aarch64) expected_job='build-tauri-macos' ;;
          esac
          jobs="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs?per_page=100" --jq '.jobs[] | [.name, (.conclusion // "")] | @tsv')"
          grep -Fqx "$expected_job"$'\t'"success" <<<"$jobs" || {
            echo "::error::Desktop Build run $SOURCE_RUN_ID has no successful $expected_job job"
            exit 1
          }
          artifacts="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" --jq '.artifacts[].name')"
          grep -Fqx 'desktop-components-${{ matrix.target }}' <<<"$artifacts" || {
            echo "::error::Desktop Build run $SOURCE_RUN_ID is missing desktop-components-${{ matrix.target }}"
            exit 1
          }

      - name: Download versioned desktop component source
        if: ${{ inputs.include_desktop_components }}
        uses: actions/download-artifact@v4
        with:
          name: desktop-components-${{ matrix.target }}
          path: desktop-component-archive
          run-id: ${{ steps.desktop-source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract versioned desktop component source
        if: ${{ inputs.include_desktop_components }}
        run: |
          python scripts/pack-tauri/desktop_component_archive.py extract \
            --archive 'desktop-component-archive/desktop-components-${{ matrix.target }}.tar' \
            --output desktop-component-source

      - name: Stage backend, runtime and tool components
        if: ${{ inputs.include_desktop_components }}
        run: |
          python scripts/pack-tauri/stage_desktop_components.py \
            --binaries desktop-component-source/binaries \
            --output component-staging \
            --fallback-version '${{ inputs.core_min_version || github.event.inputs.core_min_version }}'

      - name: Fetch and verify previous component base
        env:
          COMPONENT_SIGNING_PRIVATE_KEY: ${{ secrets.COMPONENT_SIGNING_PRIVATE_KEY }}
        run: |
          python scripts/pack-tauri/prepare_component_base.py \
            --source-root component-staging \
            --base-root component-base \
            --target '${{ matrix.target }}' \
            --manifest-url "$COMPONENT_BASE_URL/metadata/components/stable/${{ matrix.target }}.current.json" \
            --history-count '${{ inputs.history_count || 10 }}' \
            --history-output component-history/${{ matrix.target }}.history.json \
            --history-signature-output component-history/${{ matrix.target }}.history.json.sig

      - name: Build and sign component release
        env:
          COMPONENT_SIGNING_PRIVATE_KEY: ${{ secrets.COMPONENT_SIGNING_PRIVATE_KEY }}
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%cI HEAD)"
          python scripts/pack-tauri/build_component_release.py \
            --source-root component-staging \
            --output-root component-release \
            --target '${{ matrix.target }}' \
            --core-min-version '${{ inputs.core_min_version || github.event.inputs.core_min_version }}' \
            --base-url "$COMPONENT_BASE_URL" \
            --base-root component-base \
            --release-id "${{ inputs.release_id || format('{0}-{1}', github.run_id, github.run_attempt) }}" \
            --release-version '${{ inputs.core_min_version || github.event.inputs.core_min_version }}' \
            --release-sequence '${{ github.run_id }}' \
            --release-attempt '${{ github.run_attempt }}' \
            --history-input component-history/${{ matrix.target }}.history.json \
            --history-signature-input component-history/${{ matrix.target }}.history.json.sig \
            --history-count '${{ inputs.history_count || 10 }}' \
            --delta-max-ratio '${{ inputs.delta_max_ratio || '0.8' }}'

      - name: Verify generated artifacts
        run: |
          find component-release/metadata/components/stable -maxdepth 1 \
            -name '${{ matrix.target }}-*.json' \
            ! -name '*.history.json' -type f -size +0 | grep -q .
          test -s component-release/metadata/components/stable/${{ matrix.target }}.current.json
          find component-release/metadata/components/stable -maxdepth 1 \
            -name '${{ matrix.target }}-*.history.json' -type f -size +0 | grep -q .
          find component-release/metadata/components/stable -maxdepth 1 \
            -name '${{ matrix.target }}-*.history.json.sig' -type f -size +0 | grep -q .
          find component-release/artifacts -name '*.zip' -type f -size +0 -print

      - uses: actions/upload-artifact@v4
        with:
          name: component-release-${{ matrix.target }}
          path: component-release/
          if-no-files-found: error

      - name: Install ossutil
        if: inputs.upload_to_oss
        run: |
          wget -q https://gosspublic.alicdn.com/ossutil/1.7.18/ossutil-v1.7.18-linux-amd64.zip
          unzip -q ossutil-v1.7.18-linux-amd64.zip
          sudo install ossutil-v1.7.18-linux-amd64/ossutil64 /usr/local/bin/ossutil

      - name: Configure OSS
        if: inputs.upload_to_oss
        run: |
          ossutil config -e '${{ secrets.OSS_ENDPOINT }}' \
            -i '${{ secrets.OSS_ACCESS_KEY_ID }}' \
            -k '${{ secrets.OSS_ACCESS_KEY_SECRET }}' -L CH

      - name: Upload immutable component artifacts first
        if: inputs.upload_to_oss
        env:
          OSS_BUCKET: ${{ vars.OSS_BUCKET || 'ugsci-download' }}
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            relative="${file#component-release/}"
            uri="oss://${OSS_BUCKET}/${relative}"
            remote="${RUNNER_TEMP}/artifact-${RANDOM}-$(basename "$file")"
            if ossutil cp "$uri" "$remote" >/dev/null 2>&1; then
              if ! cmp -s "$file" "$remote"; then
                echo "Immutable component artifact differs from local build: ${relative}" >&2
                exit 1
              fi
              rm -f "$remote"
              continue
            fi
            ossutil cp "$file" "$uri" --acl public-read \
              --meta "Cache-Control:public, max-age=31536000, immutable"
          done < <(find component-release/artifacts -type f)

      - name: Verify artifacts exist on OSS
        if: inputs.upload_to_oss
        env:
          OSS_BUCKET: ${{ vars.OSS_BUCKET || 'ugsci-download' }}
        run: |
          while IFS= read -r file; do
            relative="${file#component-release/}"
            remote="${RUNNER_TEMP}/$(basename "$file")"
            ossutil cp "oss://${OSS_BUCKET}/${relative}" "$remote" >/dev/null
            cmp -s "$file" "$remote"
          done < <(find component-release/artifacts -type f)

      # The signed manifest is intentionally published last. Clients cannot
      # observe a release until all referenced immutable artifacts exist.
      - name: Publish signed component manifest last
        if: inputs.upload_to_oss
        env:
          OSS_BUCKET: ${{ vars.OSS_BUCKET || 'ugsci-download' }}
          COMPONENT_SIGNING_PRIVATE_KEY: ${{ secrets.COMPONENT_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          manifest=$(find component-release/metadata/components/stable \
            -name '${{ matrix.target }}-*.json' \
            ! -name '*.history.json' -type f -print -quit)
          test -s "$manifest"
          manifest_name=$(basename "$manifest")
          manifest_uri="oss://${OSS_BUCKET}/metadata/components/stable/${manifest_name}"
          manifest_sig_uri="${manifest_uri}.sig"
          publish_immutable() {
            local file="$1" uri="$2" label="$3"
            local remote_dir
            remote_dir="$(mktemp -d)"
            local remote="${remote_dir}/$(basename "$file")"
            if ossutil cp "$uri" "$remote" >/dev/null 2>&1; then
              if ! cmp -s "$file" "$remote"; then
                echo "Immutable component ${label} differs from local build" >&2
                exit 1
              fi
              rm -rf "$remote_dir"
              return
            fi
            ossutil cp "$file" "$uri" --acl public-read \
              --meta "Cache-Control:public, max-age=31536000, immutable"
            ossutil cp "$uri" "$remote"
            cmp -s "$file" "$remote" || { echo "Remote component ${label} verification failed" >&2; exit 1; }
            rm -rf "$remote_dir"
          }
          publish_immutable "$manifest" "$manifest_uri" "manifest ${manifest_name}"
          publish_immutable "${manifest}.sig" "$manifest_sig_uri" "signature ${manifest_name}.sig"
          pointer="component-release/metadata/components/stable/${{ matrix.target }}.current.json"
          remote_pointer="${RUNNER_TEMP}/${{ matrix.target }}.remote-current.json"
          if ossutil cp "oss://${OSS_BUCKET}/metadata/components/stable/${{ matrix.target }}.current.json" "$remote_pointer" >/dev/null 2>&1; then
            python scripts/pack-tauri/check_component_pointer_promotion.py \
              --local "$pointer" --remote "$remote_pointer" --target '${{ matrix.target }}'
            history=$(find component-release/metadata/components/stable -name '${{ matrix.target }}-*.history.json' -type f | head -1)
            remote_history_url=$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("history_url", ""))' "$remote_pointer")
            if [[ -z "$remote_history_url" ]]; then
              echo "Remote pointer predates signed history; publishing migration history"
            else
            remote_history_key=$(python -c 'from urllib.parse import urlparse; import sys; print(urlparse(sys.argv[1]).path.lstrip("/"))' "$remote_history_url")
            remote_history="${RUNNER_TEMP}/${{ matrix.target }}.remote-history.json"
            remote_history_sig="${RUNNER_TEMP}/${{ matrix.target }}.remote-history.json.sig"
            ossutil cp "oss://${OSS_BUCKET}/${remote_history_key}" "$remote_history" >/dev/null
            ossutil cp "oss://${OSS_BUCKET}/${remote_history_key}.sig" "$remote_history_sig" >/dev/null
            python scripts/pack-tauri/merge_component_history.py \
              --local-pointer "$pointer" \
              --local-history "$history" \
              --local-history-signature "${history}.sig" \
              --remote-pointer "$remote_pointer" \
              --remote-history "$remote_history" \
              --remote-history-signature "$remote_history_sig" \
              --target '${{ matrix.target }}' --limit '${{ inputs.history_count || 10 }}'
            fi
          else
            python scripts/pack-tauri/check_component_pointer_promotion.py \
              --local "$pointer" --target '${{ matrix.target }}'
          fi
          history=$(find component-release/metadata/components/stable -name '${{ matrix.target }}-*.history.json' -type f | head -1)
          publish_immutable "$history" "oss://${OSS_BUCKET}/metadata/components/stable/$(basename "$history")" "history $(basename "$history")"
          publish_immutable "${history}.sig" "oss://${OSS_BUCKET}/metadata/components/stable/$(basename "$history").sig" "history signature $(basename "$history").sig"
          pointer_tmp="oss://${OSS_BUCKET}/metadata/components/stable/${{ matrix.target }}.current.json.staging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ossutil cp "$pointer" "$pointer_tmp" --acl public-read
          ossutil ls "$pointer_tmp" >/dev/null
          ossutil cp "$pointer_tmp" "oss://${OSS_BUCKET}/metadata/components/stable/${{ matrix.target }}.current.json" --acl public-read --force --meta "Cache-Control:public, max-age=0, must-revalidate"
          ossutil rm "$pointer_tmp" --force || true
          verify_dir="$(mktemp -d)"
          verify_file="${verify_dir}/${{ matrix.target }}.current.json"
          ossutil cp "oss://${OSS_BUCKET}/metadata/components/stable/${{ matrix.target }}.current.json" "$verify_file"
          cmp -s "$pointer" "$verify_file" || { echo "Promoted component pointer verification failed" >&2; exit 1; }
          rm -rf "$verify_dir"
