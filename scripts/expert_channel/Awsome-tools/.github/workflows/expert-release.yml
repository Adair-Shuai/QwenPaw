name: Build and publish expert package

on:
  workflow_dispatch:
    inputs:
      recipe:
        description: Recipe path under experts/
        required: true
        default: experts/version-demo/recipe.json
        type: string
      publish:
        description: Publish verified artifacts to the existing UGSci expert channel
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: expert-release-${{ inputs.recipe }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      toolchain: ${{ steps.plan.outputs.toolchain }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: plan
        env:
          RECIPE: ${{ inputs.recipe }}
          TOOLCHAIN: ${{ vars.UGSCI_EXPERT_TOOLCHAIN_REF }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          ref = os.environ['TOOLCHAIN']
          if not re.fullmatch(r'[0-9a-f]{40}', ref):
              raise SystemExit('Configure an immutable UGSCI_EXPERT_TOOLCHAIN_REF containing the expert release tools')
          root = pathlib.Path('experts').resolve()
          recipe = pathlib.Path(os.environ['RECIPE']).resolve()
          if not recipe.is_relative_to(root) or recipe.name != 'recipe.json':
              raise SystemExit('Recipe must be experts/<id>/recipe.json')
          data = json.loads(recipe.read_text())
          if data.get('schema_version') != 'expert-recipe.v1':
              raise SystemExit('Unsupported recipe')
          runners = {'windows-x86_64': 'windows-2022', 'macos-aarch64': 'macos-15', 'macos-x86_64': 'macos-15-intel', 'linux-x86_64': 'ubuntu-24.04'}
          rows = []
          for variant in data['variants']:
              if variant['python'] not in ('3.11', '3.12', '3.13'):
                  raise SystemExit('Unsupported Python version')
              rows.append({'runner': runners[variant['target']], 'target': variant['target'], 'python': variant['python']})
          if not rows or len(rows) > 20 or len({(r['target'], r['python']) for r in rows}) != len(rows):
              raise SystemExit('Invalid or duplicate platform variants')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('matrix=' + json.dumps({'include': rows}), file=output)
              print('toolchain=' + ref, file=output)
          PY

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: content
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Adair-Shuai/QwenPaw
          ref: ${{ needs.plan.outputs.toolchain }}
          token: ${{ secrets.UGSCI_TOOLCHAIN_READ_TOKEN }}
          path: toolchain
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned release tooling
        run: python -m pip install ./toolchain
      - name: Stage locked wheels and run actual native MCP tests
        shell: bash
        env:
          RECIPE: ${{ inputs.recipe }}
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          python -c "import os; from qwenpaw.components.update import detect_target; assert detect_target() == os.environ['EXPECTED_TARGET']"
          python toolchain/scripts/prepare_expert_recipe.py --recipe "content/$RECIPE" --output staged
          python toolchain/scripts/build_expert_release.py --source staged/payload --spec staged/recipe.json --output release --unsigned
      - uses: actions/upload-artifact@v4
        with:
          name: expert-native-${{ matrix.target }}-${{ matrix.python }}
          path: release/expert-packages/
          if-no-files-found: error
          retention-days: 14

  seal-and-publish:
    needs: [plan, build]
    if: inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: expert-release
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Adair-Shuai/QwenPaw
          ref: ${{ needs.plan.outputs.toolchain }}
          token: ${{ secrets.UGSCI_TOOLCHAIN_READ_TOKEN }}
          path: toolchain
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ./toolchain
      - uses: actions/download-artifact@v4
        with:
          pattern: expert-native-*
          path: release/expert-packages/
          merge-multiple: true
      - name: Inspect and seal without running package code
        env:
          UGSCI_EXPERT_SIGNING_KEY: ${{ secrets.UGSCI_EXPERT_SIGNING_KEY }}
          UGSCI_EXPERT_PUBLIC_KEY: ${{ vars.UGSCI_EXPERT_PUBLIC_KEY }}
        run: python toolchain/scripts/seal_expert_release.py --root release --output sealed-release.json
      - name: Preflight then upload, read back, and publish catalog
        env:
          UGSCI_EXPERT_PUBLIC_KEY: ${{ vars.UGSCI_EXPERT_PUBLIC_KEY }}
          UGSCI_PUBLISH_SERVICE_URL: ${{ vars.UGSCI_PUBLISH_SERVICE_URL }}
          UGSCI_PUBLISH_TOKEN: ${{ secrets.UGSCI_PUBLISH_TOKEN }}
        run: python toolchain/scripts/publish_expert_release.py --input sealed-release.json
